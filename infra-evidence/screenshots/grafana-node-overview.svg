<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Grafana ダッシュボード Node Overview (Lab) 実機表示イメージ</title>
  <desc>Prometheus + Grafana + node_exporter で取得した CPU/メモリ/ディスク/Load/ネットワーク の Grafana 11 風モックアップ。アラートバナー、左サイドナビ、トップバー、6 パネルを含む。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b1f"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22252b"/>
      <stop offset="1" stop-color="#181b1f"/>
    </linearGradient>
    <linearGradient id="sparkGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7eb26d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7eb26d" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sparkYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eab839" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#eab839" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sparkOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef843c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ef843c" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sparkBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5794f2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5794f2" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="860" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1400" height="48" fill="#0b0c0e"/>
  <g transform="translate(20,15)">
    <circle cx="14" cy="9" r="11" fill="#f15a29"/>
    <text x="36" y="14" fill="#dfe1e6" font-size="14" font-weight="600">Grafana</text>
    <text x="100" y="14" fill="#5d6066" font-size="13">/</text>
    <text x="115" y="14" fill="#dfe1e6" font-size="13">Dashboards</text>
    <text x="195" y="14" fill="#5d6066" font-size="13">/</text>
    <text x="210" y="14" fill="#dfe1e6" font-size="13">Lab</text>
    <text x="245" y="14" fill="#5d6066" font-size="13">/</text>
    <text x="260" y="14" fill="#dfe1e6" font-size="13" font-weight="600">Node Overview (Lab)</text>
  </g>
  <!-- right side top bar -->
  <g transform="translate(1140,15)">
    <text x="0" y="14" fill="#8e9297" font-size="12">⟳ 30s</text>
    <text x="50" y="14" fill="#8e9297" font-size="12">⏱ Last 1 hour</text>
    <rect x="170" y="-2" width="76" height="22" rx="3" fill="#1f4d8a"/>
    <text x="208" y="13" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Save ▼</text>
  </g>

  <!-- Left side navigation -->
  <rect x="0" y="48" width="56" height="812" fill="#111316"/>
  <g transform="translate(28,76)">
    <text x="0" y="0" fill="#8e9297" font-size="16" text-anchor="middle">⌂</text>
    <text x="0" y="40" fill="#7eb26d" font-size="16" text-anchor="middle">▦</text>
    <text x="0" y="80" fill="#8e9297" font-size="16" text-anchor="middle">⊜</text>
    <text x="0" y="120" fill="#8e9297" font-size="16" text-anchor="middle">⚠</text>
    <text x="0" y="160" fill="#8e9297" font-size="16" text-anchor="middle">⚙</text>
    <text x="0" y="200" fill="#8e9297" font-size="16" text-anchor="middle">📋</text>
  </g>

  <!-- Alert banner -->
  <rect x="76" y="64" width="1304" height="34" rx="3" fill="#3c1c1c" stroke="#e24d42" stroke-width="1"/>
  <text x="92" y="86" fill="#e24d42" font-size="13" font-weight="700">⚠</text>
  <text x="112" y="86" fill="#fcd0cb" font-size="12" font-weight="600">HostHighMemory:</text>
  <text x="230" y="86" fill="#dfe1e6" font-size="12">lab-host-01 メモリ available が 10% 未満 (firing for 18m, severity=warning)</text>
  <text x="1340" y="86" fill="#8e9297" font-size="11" text-anchor="end">silence | view</text>

  <!-- ===== Row 1: 3 Stat panels ===== -->
  <!-- CPU 使用率 -->
  <g transform="translate(76,112)">
    <rect width="430" height="180" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">CPU 使用率</text>
    <text x="412" y="26" fill="#5d6066" font-size="11" text-anchor="end">%</text>
    <text x="215" y="115" fill="#7eb26d" font-size="64" font-weight="700" text-anchor="middle">23.4</text>
    <text x="215" y="145" fill="#8e9297" font-size="13" text-anchor="middle">lab-host-01</text>
    <rect x="18" y="160" width="270" height="5" fill="#7eb26d"/>
    <rect x="288" y="160" width="60" height="5" fill="#eab839"/>
    <rect x="348" y="160" width="64" height="5" fill="#e24d42"/>
    <text x="18" y="175" fill="#5d6066" font-size="10">0</text>
    <text x="288" y="175" fill="#5d6066" font-size="10">70</text>
    <text x="348" y="175" fill="#5d6066" font-size="10">85</text>
    <text x="412" y="175" fill="#5d6066" font-size="10" text-anchor="end">100</text>
  </g>

  <!-- メモリ使用率 (firing) -->
  <g transform="translate(516,112)">
    <rect width="430" height="180" rx="3" fill="url(#panel)" stroke="#e24d42" stroke-width="1.5"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">メモリ使用率</text>
    <text x="220" y="26" fill="#e24d42" font-size="11">⚠ HostHighMemory firing</text>
    <text x="412" y="26" fill="#5d6066" font-size="11" text-anchor="end">%</text>
    <text x="215" y="115" fill="#e24d42" font-size="64" font-weight="700" text-anchor="middle">91.4</text>
    <text x="215" y="145" fill="#8e9297" font-size="13" text-anchor="middle">lab-host-01</text>
    <rect x="18" y="160" width="200" height="5" fill="#7eb26d"/>
    <rect x="218" y="160" width="68" height="5" fill="#eab839"/>
    <rect x="286" y="160" width="126" height="5" fill="#e24d42"/>
    <text x="18" y="175" fill="#5d6066" font-size="10">0</text>
    <text x="218" y="175" fill="#5d6066" font-size="10">75</text>
    <text x="286" y="175" fill="#5d6066" font-size="10">90</text>
    <text x="412" y="175" fill="#5d6066" font-size="10" text-anchor="end">100</text>
  </g>

  <!-- ディスク空き率 -->
  <g transform="translate(956,112)">
    <rect width="424" height="180" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">ディスク空き率 (/)</text>
    <text x="406" y="26" fill="#5d6066" font-size="11" text-anchor="end">%</text>
    <text x="212" y="115" fill="#7eb26d" font-size="64" font-weight="700" text-anchor="middle">42.6</text>
    <text x="212" y="145" fill="#8e9297" font-size="13" text-anchor="middle">lab-host-01</text>
    <rect x="18" y="160" width="42" height="5" fill="#e24d42"/>
    <rect x="60" y="160" width="42" height="5" fill="#eab839"/>
    <rect x="102" y="160" width="304" height="5" fill="#7eb26d"/>
    <text x="18" y="175" fill="#5d6066" font-size="10">0</text>
    <text x="60" y="175" fill="#5d6066" font-size="10">10</text>
    <text x="102" y="175" fill="#5d6066" font-size="10">20</text>
    <text x="406" y="175" fill="#5d6066" font-size="10" text-anchor="end">100</text>
  </g>

  <!-- ===== Row 2: 2 time series ===== -->
  <!-- Load average -->
  <g transform="translate(76,302)">
    <rect width="646" height="270" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">Load average (1m / 5m / 15m)</text>
    <text x="630" y="26" fill="#5d6066" font-size="11" text-anchor="end">load</text>
    <!-- y-axis -->
    <text x="36" y="56" fill="#5d6066" font-size="10" text-anchor="end">2.0</text>
    <text x="36" y="106" fill="#5d6066" font-size="10" text-anchor="end">1.5</text>
    <text x="36" y="156" fill="#5d6066" font-size="10" text-anchor="end">1.0</text>
    <text x="36" y="206" fill="#5d6066" font-size="10" text-anchor="end">0.5</text>
    <text x="36" y="256" fill="#5d6066" font-size="10" text-anchor="end">0.0</text>
    <line x1="40" y1="50" x2="630" y2="50" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="100" x2="630" y2="100" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="150" x2="630" y2="150" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="200" x2="630" y2="200" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="250" x2="630" y2="250" stroke="#2c3035"/>

    <!-- load1 - blue, jagged -->
    <polyline points="40,170 80,160 120,150 160,165 200,140 240,125 280,130 320,110 360,95 400,105 440,80 480,90 520,75 560,85 600,70 630,80"
              fill="none" stroke="#5794f2" stroke-width="2"/>
    <!-- load5 - green smoother -->
    <polyline points="40,185 80,178 120,170 160,170 200,155 240,150 280,145 320,135 360,128 400,125 440,115 480,118 520,108 560,108 600,100 630,105"
              fill="none" stroke="#7eb26d" stroke-width="2"/>
    <!-- load15 - orange flatter -->
    <polyline points="40,195 80,193 120,188 160,188 200,180 240,178 280,175 320,168 360,162 400,160 440,155 480,153 520,148 560,146 600,140 630,142"
              fill="none" stroke="#ef843c" stroke-width="2"/>

    <!-- legend -->
    <g transform="translate(50,254)">
      <rect width="10" height="3" y="-3" fill="#5794f2"/>
      <text x="16" y="0" fill="#dfe1e6" font-size="11">load1</text>
      <rect width="10" height="3" y="-3" x="70" fill="#7eb26d"/>
      <text x="86" y="0" fill="#dfe1e6" font-size="11">load5</text>
      <rect width="10" height="3" y="-3" x="150" fill="#ef843c"/>
      <text x="166" y="0" fill="#dfe1e6" font-size="11">load15</text>
    </g>

    <!-- x-axis labels -->
    <text x="40" y="269" fill="#5d6066" font-size="10">14:00</text>
    <text x="200" y="269" fill="#5d6066" font-size="10">14:15</text>
    <text x="360" y="269" fill="#5d6066" font-size="10">14:30</text>
    <text x="520" y="269" fill="#5d6066" font-size="10">14:45</text>
    <text x="630" y="269" fill="#5d6066" font-size="10" text-anchor="end">15:00</text>
  </g>

  <!-- Network receive -->
  <g transform="translate(734,302)">
    <rect width="646" height="270" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">ネットワーク受信 (bytes/s)</text>
    <text x="630" y="26" fill="#5d6066" font-size="11" text-anchor="end">B/s</text>
    <text x="36" y="56" fill="#5d6066" font-size="10" text-anchor="end">120k</text>
    <text x="36" y="106" fill="#5d6066" font-size="10" text-anchor="end">90k</text>
    <text x="36" y="156" fill="#5d6066" font-size="10" text-anchor="end">60k</text>
    <text x="36" y="206" fill="#5d6066" font-size="10" text-anchor="end">30k</text>
    <text x="36" y="256" fill="#5d6066" font-size="10" text-anchor="end">0</text>
    <line x1="40" y1="50" x2="630" y2="50" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="100" x2="630" y2="100" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="150" x2="630" y2="150" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="200" x2="630" y2="200" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="250" x2="630" y2="250" stroke="#2c3035"/>

    <!-- area shape -->
    <polygon points="40,250 40,210 80,205 120,180 160,175 200,140 240,150 280,125 320,90 360,110 400,80 440,95 480,70 520,90 560,75 600,85 630,95 630,250"
             fill="url(#sparkBlue)"/>
    <polyline points="40,210 80,205 120,180 160,175 200,140 240,150 280,125 320,90 360,110 400,80 440,95 480,70 520,90 560,75 600,85 630,95"
              fill="none" stroke="#5794f2" stroke-width="2"/>

    <g transform="translate(50,254)">
      <rect width="10" height="3" y="-3" fill="#5794f2"/>
      <text x="16" y="0" fill="#dfe1e6" font-size="11">eth0 RX bytes</text>
    </g>
    <text x="40" y="269" fill="#5d6066" font-size="10">14:00</text>
    <text x="200" y="269" fill="#5d6066" font-size="10">14:15</text>
    <text x="360" y="269" fill="#5d6066" font-size="10">14:30</text>
    <text x="520" y="269" fill="#5d6066" font-size="10">14:45</text>
    <text x="630" y="269" fill="#5d6066" font-size="10" text-anchor="end">15:00</text>
  </g>

  <!-- ===== Row 3: 2 time series wide ===== -->
  <!-- CPU per-core usage -->
  <g transform="translate(76,582)">
    <rect width="980" height="260" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">CPU 使用率（コア別）</text>
    <text x="966" y="26" fill="#5d6066" font-size="11" text-anchor="end">%</text>
    <text x="36" y="56" fill="#5d6066" font-size="10" text-anchor="end">80</text>
    <text x="36" y="106" fill="#5d6066" font-size="10" text-anchor="end">60</text>
    <text x="36" y="156" fill="#5d6066" font-size="10" text-anchor="end">40</text>
    <text x="36" y="206" fill="#5d6066" font-size="10" text-anchor="end">20</text>
    <text x="36" y="246" fill="#5d6066" font-size="10" text-anchor="end">0</text>
    <line x1="40" y1="50"  x2="970" y2="50"  stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="100" x2="970" y2="100" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="150" x2="970" y2="150" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="200" x2="970" y2="200" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="240" x2="970" y2="240" stroke="#2c3035"/>

    <!-- core0 -->
    <polyline points="40,200 90,195 140,180 190,175 240,165 290,160 340,145 390,150 440,140 490,135 540,130 590,140 640,125 690,135 740,125 790,118 840,125 890,118 940,128 970,118"
              fill="none" stroke="#7eb26d" stroke-width="1.5"/>
    <!-- core1 -->
    <polyline points="40,180 90,178 140,170 190,178 240,160 290,168 340,165 390,160 440,170 490,158 540,168 590,165 640,158 690,170 740,160 790,170 840,165 890,170 940,160 970,170"
              fill="none" stroke="#5794f2" stroke-width="1.5"/>
    <!-- core2 -->
    <polyline points="40,210 90,215 140,200 190,210 240,200 290,195 340,205 390,200 440,195 490,200 540,210 590,195 640,200 690,205 740,200 790,195 840,200 890,205 940,200 970,195"
              fill="none" stroke="#eab839" stroke-width="1.5"/>
    <!-- core3 -->
    <polyline points="40,205 90,200 140,210 190,205 240,215 290,200 340,210 390,205 440,210 490,205 540,200 590,210 640,205 690,200 740,210 790,205 840,200 890,210 940,205 970,210"
              fill="none" stroke="#ef843c" stroke-width="1.5"/>

    <g transform="translate(50,254)">
      <rect width="10" height="3" y="-3" fill="#7eb26d"/>
      <text x="16" y="0" fill="#dfe1e6" font-size="11">core0</text>
      <rect width="10" height="3" y="-3" x="70" fill="#5794f2"/>
      <text x="86" y="0" fill="#dfe1e6" font-size="11">core1</text>
      <rect width="10" height="3" y="-3" x="140" fill="#eab839"/>
      <text x="156" y="0" fill="#dfe1e6" font-size="11">core2</text>
      <rect width="10" height="3" y="-3" x="210" fill="#ef843c"/>
      <text x="226" y="0" fill="#dfe1e6" font-size="11">core3</text>
    </g>
    <text x="40" y="259" fill="#5d6066" font-size="10">15分前</text>
    <text x="970" y="259" fill="#5d6066" font-size="10" text-anchor="end">現在</text>
  </g>

  <!-- Disk free per partition -->
  <g transform="translate(1066,582)">
    <rect width="314" height="260" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">パーティション別空き</text>

    <!-- bar list -->
    <g transform="translate(18,52)">
      <text x="0" y="0" fill="#8e9297" font-size="11">/</text>
      <rect x="0" y="6" width="278" height="14" fill="#2c3035"/>
      <rect x="0" y="6" width="118" height="14" fill="#7eb26d"/>
      <text x="270" y="17" fill="#dfe1e6" font-size="11" text-anchor="end">42.6 / 100 GB</text>

      <text x="0" y="42" fill="#8e9297" font-size="11">/var</text>
      <rect x="0" y="48" width="278" height="14" fill="#2c3035"/>
      <rect x="0" y="48" width="62" height="14" fill="#eab839"/>
      <text x="270" y="59" fill="#dfe1e6" font-size="11" text-anchor="end">14.0 / 50 GB</text>

      <text x="0" y="84" fill="#8e9297" font-size="11">/home</text>
      <rect x="0" y="90" width="278" height="14" fill="#2c3035"/>
      <rect x="0" y="90" width="190" height="14" fill="#7eb26d"/>
      <text x="270" y="101" fill="#dfe1e6" font-size="11" text-anchor="end">68.5 / 100 GB</text>

      <text x="0" y="126" fill="#8e9297" font-size="11">/srv/data</text>
      <rect x="0" y="132" width="278" height="14" fill="#2c3035"/>
      <rect x="0" y="132" width="20"  height="14" fill="#e24d42"/>
      <text x="270" y="143" fill="#dfe1e6" font-size="11" text-anchor="end">3.6 / 50 GB</text>

      <text x="0" y="168" fill="#8e9297" font-size="11">/mnt/backup</text>
      <rect x="0" y="174" width="278" height="14" fill="#2c3035"/>
      <rect x="0" y="174" width="220" height="14" fill="#7eb26d"/>
      <text x="270" y="185" fill="#dfe1e6" font-size="11" text-anchor="end">792 / 1000 GB</text>
    </g>
  </g>

  <!-- Footer status -->
  <text x="76" y="850" fill="#5d6066" font-size="10">Data source: Prometheus</text>
  <text x="280" y="850" fill="#5d6066" font-size="10">Scrape interval: 15s</text>
  <text x="500" y="850" fill="#5d6066" font-size="10">node_exporter: lab-host-01 (up)</text>
  <text x="1380" y="850" fill="#5d6066" font-size="10" text-anchor="end">Grafana 11.2.0  ·  Lab</text>
</svg>
