# 最小構成の監視スタック（Metrics + Logs）
# Prometheus + node_exporter + Grafana に加え、Loki + Promtail を追加した Lab 用 compose ファイル。
# 想定: 自宅検証VM / 1台のLinuxサーバー / 評価環境。
# 観測性の三本柱のうち「Metrics」「Logs」をここで網羅し、Traces は本番化差分で扱う。
# 本番では node_exporter を監視対象側へ分けて配置し、Loki のストレージを S3 / GCS に切替、認証 + TLS を有効化する。

services:
  prometheus:
    # 監視データの収集とアラート評価を担当
    image: prom/prometheus:v2.54.1
    container_name: lab-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    # Linux Docker Engine では host.docker.internal が自動解決されないため、
    # extra_hosts で host-gateway を渡してホスト上の node_exporter (9100) へ到達できるようにする。
    # Docker Desktop (Mac / Windows) では元から解決できるので、この行があっても問題ない。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  node_exporter:
    # ホストのCPU / メモリ / ディスク / ネットワーク統計を Prometheus が読み取れる形式で公開
    image: prom/node-exporter:v1.8.2
    container_name: lab-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave

  grafana:
    # ダッシュボード表示（Prometheus メトリクス + Loki ログを 1 つの UI に統合）
    image: grafana/grafana:11.2.0
    container_name: lab-grafana
    restart: unless-stopped
    environment:
      # 公開検証なので簡易パスワード。実運用では .env で必ず変更する。
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  loki:
    # ログ集約。Promtail から流れてきたログを保存し、Grafana から LogQL で検索可能にする
    image: grafana/loki:3.2.0
    container_name: lab-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  promtail:
    # ホストの /var/log と systemd journal、Docker コンテナログを Loki に送信
    image: grafana/promtail:3.2.0
    container_name: lab-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # systemd journal （Lab Linux ホスト向け。Docker Desktop / Mac では空でも問題なし）
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      - loki
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
