    <rect width="940" height="140" fill="#ffffff" stroke="#d0d0d0"/>
    <rect width="940" height="32" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="14" y="22" fill="#1a1a1a" font-size="12" font-weight="600">shimada-lab-app-nsg / Inbound security rules</text>

    <line x1="0" y1="32" x2="940" y2="32" stroke="#d0d0d0"/>
    <text x="14" y="50" fill="#666" font-size="10" font-weight="600">Priority</text>
    <text x="80" y="50" fill="#666" font-size="10" font-weight="600">Name</text>
    <text x="240" y="50" fill="#666" font-size="10" font-weight="600">Source</text>
    <text x="420" y="50" fill="#666" font-size="10" font-weight="600">Destination</text>
    <text x="560" y="50" fill="#666" font-size="10" font-weight="600">Service</text>
    <text x="700" y="50" fill="#666" font-size="10" font-weight="600">Action</text>
    <text x="820" y="50" fill="#666" font-size="10" font-weight="600">Status</text>
    <line x1="0" y1="58" x2="940" y2="58" stroke="#e0e0e0"/>

    <text x="14" y="76" fill="#1a1a1a" font-size="10" font-family="monospace">1000</text>
    <text x="80" y="76" fill="#0078d4" font-size="10" font-weight="600">AllowBastionSSHIn</text>
    <text x="240" y="76" fill="#1a1a1a" font-size="10" font-family="monospace">10.50.255.0/27 (Bastion)</text>
    <text x="420" y="76" fill="#1a1a1a" font-size="10" font-family="monospace">Any</text>
    <text x="560" y="76" fill="#1a1a1a" font-size="10" font-family="monospace">TCP/22</text>
    <text x="700" y="76" fill="#107c10" font-size="10" font-weight="600">✓ Allow</text>
    <text x="820" y="76" fill="#107c10" font-size="10">✓ Applied</text>
    <line x1="0" y1="84" x2="940" y2="84" stroke="#f0f0f0"/>

    <text x="14" y="102" fill="#1a1a1a" font-size="10" font-family="monospace">4000</text>
    <text x="80" y="102" fill="#0078d4" font-size="10" font-weight="600">DenyInternetIn</text>
    <text x="240" y="102" fill="#1a1a1a" font-size="10" font-family="monospace">Internet</text>
    <text x="420" y="102" fill="#1a1a1a" font-size="10" font-family="monospace">Any</text>
    <text x="560" y="102" fill="#1a1a1a" font-size="10" font-family="monospace">Any</text>
    <text x="700" y="102" fill="#d83b01" font-size="10" font-weight="600">✗ Deny</text>
    <text x="820" y="102" fill="#107c10" font-size="10">✓ Applied</text>
    <line x1="0" y1="110" x2="940" y2="110" stroke="#f0f0f0"/>

    <text x="14" y="128" fill="#1a1a1a" font-size="10" font-family="monospace">65500</text>
    <text x="80" y="128" fill="#666" font-size="10" font-style="italic">DenyAllInbound (default)</text>
    <text x="240" y="128" fill="#1a1a1a" font-size="10" font-family="monospace">Any</text>
    <text x="420" y="128" fill="#1a1a1a" font-size="10" font-family="monospace">Any</text>
    <text x="560" y="128" fill="#1a1a1a" font-size="10" font-family="monospace">Any</text>
    <text x="700" y="128" fill="#666" font-size="10">✗ Deny</text>
