<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Prometheus Alerts ページ実機表示イメージ</title>
  <desc>Prometheus の Alerts ページで、host-baseline グループの 4 アラート (HostHighCpu, HostHighMemory, HostLowDisk, NodeExporterDown) の状態を表示。HostHighMemory が firing、それ以外は inactive。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#e9ecef"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="700" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1400" height="48" fill="#e6522c"/>
  <g transform="translate(20,15)">
    <text x="0" y="20" fill="#fff" font-size="14" font-weight="700">Prometheus</text>
  </g>
  <g transform="translate(140,15)">
    <text x="0" y="20" fill="#fff" font-size="13">Alerts</text>
    <text x="60" y="20" fill="rgba(255,255,255,0.7)" font-size="13">Graph</text>
    <text x="120" y="20" fill="rgba(255,255,255,0.7)" font-size="13">Status ▼</text>
    <text x="200" y="20" fill="rgba(255,255,255,0.7)" font-size="13">Help</text>
  </g>

  <!-- Title and filter -->
  <text x="20" y="86" fill="#212529" font-size="22" font-weight="700">Alerts</text>
  <g transform="translate(20,108)">
    <rect width="100" height="28" rx="3" fill="#1f4d8a"/>
    <text x="50" y="18" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Inactive (3)</text>
    <rect x="110" width="100" height="28" rx="3" fill="#fff7e6" stroke="#eab839"/>
    <text x="160" y="18" fill="#7a5a00" font-size="12" font-weight="600" text-anchor="middle">Pending (0)</text>
    <rect x="220" width="100" height="28" rx="3" fill="#ffe6e6" stroke="#e24d42"/>
    <text x="270" y="18" fill="#a31515" font-size="12" font-weight="600" text-anchor="middle">Firing (1)</text>
    <rect x="340" width="180" height="28" rx="3" fill="#fff" stroke="#ced4da"/>
    <text x="354" y="18" fill="#495057" font-size="12">🔍 Filter alerts...</text>
  </g>

  <!-- Group header -->
  <g transform="translate(20,156)">
    <rect width="1360" height="40" rx="3" fill="#fff" stroke="#dee2e6"/>
    <text x="14" y="26" fill="#212529" font-size="14" font-weight="600">▼ host-baseline  /etc/prometheus/alert.rules.yml</text>
    <text x="1346" y="26" fill="#6c757d" font-size="12" text-anchor="end">4 rules</text>
  </g>

  <!-- Alert 1: HostHighCpu (inactive) -->
  <g transform="translate(20,204)">
    <rect width="1360" height="92" rx="3" fill="#fff" stroke="#dee2e6"/>
    <rect width="6" height="92" fill="#1f4d8a"/>
    <text x="20" y="24" fill="#212529" font-size="14" font-weight="600">HostHighCpu</text>
    <rect x="160" y="10" width="64" height="20" rx="3" fill="#e7f0fd"/>
    <text x="192" y="24" fill="#1f4d8a" font-size="11" font-weight="600" text-anchor="middle">inactive</text>
    <text x="20" y="50" fill="#495057" font-size="12" font-family="ui-monospace, SFMono-Regular, monospace">100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) &gt; 85</text>
    <text x="20" y="74" fill="#6c757d" font-size="11">for: 10m  ·  severity: warning  ·  No instances firing</text>
  </g>

  <!-- Alert 2: HostHighMemory (firing) -->
  <g transform="translate(20,304)">
    <rect width="1360" height="120" rx="3" fill="#fff5f5" stroke="#e24d42" stroke-width="1.3"/>
    <rect width="6" height="120" fill="#e24d42"/>
    <text x="20" y="24" fill="#212529" font-size="14" font-weight="600">HostHighMemory</text>
    <rect x="180" y="10" width="58" height="20" rx="3" fill="#e24d42"/>
    <text x="209" y="24" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">firing</text>
    <text x="20" y="50" fill="#495057" font-size="12" font-family="ui-monospace, SFMono-Regular, monospace">(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 &gt; 90</text>
    <text x="20" y="74" fill="#495057" font-size="12">for: 15m  ·  severity: warning</text>

    <!-- Instance row -->
    <rect x="20" y="84" width="1320" height="28" rx="2" fill="#fff" stroke="#e24d42"/>
    <text x="32" y="102" fill="#e24d42" font-size="11" font-weight="700">⚠</text>
    <text x="54" y="102" fill="#212529" font-size="11" font-family="ui-monospace, SFMono-Regular, monospace">{host="lab-host-01", instance="host.docker.internal:9100", severity="warning"} = 91.4</text>
    <text x="1330" y="102" fill="#6c757d" font-size="11" text-anchor="end">since 15:24 (18m)</text>
  </g>

  <!-- Alert 3: HostLowDisk (inactive) -->
  <g transform="translate(20,432)">
    <rect width="1360" height="92" rx="3" fill="#fff" stroke="#dee2e6"/>
    <rect width="6" height="92" fill="#1f4d8a"/>
    <text x="20" y="24" fill="#212529" font-size="14" font-weight="600">HostLowDisk</text>
    <rect x="140" y="10" width="64" height="20" rx="3" fill="#e7f0fd"/>
    <text x="172" y="24" fill="#1f4d8a" font-size="11" font-weight="600" text-anchor="middle">inactive</text>
    <text x="220" y="24" fill="#a31515" font-size="11">severity=critical</text>
    <text x="20" y="50" fill="#495057" font-size="12" font-family="ui-monospace, SFMono-Regular, monospace">(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 &lt; 10</text>
    <text x="20" y="74" fill="#6c757d" font-size="11">for: 10m  ·  No instances firing</text>
  </g>

  <!-- Alert 4: NodeExporterDown (inactive) -->
  <g transform="translate(20,532)">
    <rect width="1360" height="92" rx="3" fill="#fff" stroke="#dee2e6"/>
    <rect width="6" height="92" fill="#1f4d8a"/>
    <text x="20" y="24" fill="#212529" font-size="14" font-weight="600">NodeExporterDown</text>
    <rect x="180" y="10" width="64" height="20" rx="3" fill="#e7f0fd"/>
    <text x="212" y="24" fill="#1f4d8a" font-size="11" font-weight="600" text-anchor="middle">inactive</text>
    <text x="260" y="24" fill="#a31515" font-size="11">severity=critical</text>
    <text x="20" y="50" fill="#495057" font-size="12" font-family="ui-monospace, SFMono-Regular, monospace">up{job="node"} == 0</text>
    <text x="20" y="74" fill="#6c757d" font-size="11">for: 5m  ·  up == 1 for all targets</text>
  </g>

  <!-- footer -->
  <text x="20" y="680" fill="#6c757d" font-size="11">Prometheus v2.54.1  ·  Last evaluation: 15:42:33  ·  Rule files loaded: 1</text>
</svg>
