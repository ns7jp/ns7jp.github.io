name: Docker build & publish

# main へのマージで healthcheck-cli イメージを ghcr.io へ publish する。
# - PR では build/test のみ、push なし
# - main では multi-arch (amd64 + arm64) で ghcr へ push
# - イメージタグ: latest, <git sha>, <semver tag>
# - publish 前に trivy で HIGH/CRITICAL を再チェック

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'docker-lab/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/healthcheck-cli

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: docker-lab
          platforms: linux/amd64
          push: false
          load: true
          tags: healthcheck-cli:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy security gate
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: healthcheck-cli:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: docker-lab
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
