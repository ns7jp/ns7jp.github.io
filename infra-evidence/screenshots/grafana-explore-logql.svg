<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Grafana Explore (Loki LogQL) クエリ画面イメージ</title>
  <desc>Grafana > Explore で Loki データソースを選び、LogQL クエリ `{unit="ssh.service"} |~ "Failed password"` を実行した結果。クエリエディタ、ヒストグラム、ログラインを含む。</desc>

