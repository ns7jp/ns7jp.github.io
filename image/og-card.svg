<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">島田則幸 Linux Server Build &amp; Operations Portfolio</title>
  <desc id="desc">Linuxサーバーの設計、構築、試験、監視、復旧を、実測済みと未実施に分けて公開するポートフォリオのOG画像</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2733"/>
      <stop offset="1" stop-color="#30475A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0CF72"/>
      <stop offset="1" stop-color="#B98A28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0B1117" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="8" fill="url(#gold)"/>
  <circle cx="1080" cy="-40" r="250" fill="#F0CF72" opacity="0.05"/>
  <circle cx="1125" cy="570" r="210" fill="#8EB59A" opacity="0.06"/>

  <g font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif">
    <text x="70" y="72" fill="#F0CF72" font-size="20" font-weight="700" letter-spacing="5">LINUX SERVER PORTFOLIO</text>
    <text x="70" y="166" fill="#FFFFFF" font-size="68" font-weight="700" letter-spacing="1">Linux Server</text>
    <text x="70" y="238" fill="#FFFFFF" font-size="56" font-weight="600" letter-spacing="1">Build &amp; Operations</text>
    <text x="72" y="288" fill="#D9E2E8" font-size="28" font-weight="500" letter-spacing="2">設計・構築・試験・監視・復旧・引き渡し</text>

    <g transform="translate(70 336)">
      <rect width="180" height="72" rx="8" fill="#FFFFFF" opacity="0.09" stroke="#F0CF72" stroke-opacity="0.42"/>
      <text x="20" y="31" fill="#F0CF72" font-size="15" font-weight="700" letter-spacing="1">BUILD PACKAGE</text>
      <text x="20" y="57" fill="#FFFFFF" font-size="23" font-weight="700">10 成果物</text>
    </g>
    <g transform="translate(266 336)">
      <rect width="180" height="72" rx="8" fill="#FFFFFF" opacity="0.09" stroke="#F0CF72" stroke-opacity="0.42"/>
      <text x="20" y="31" fill="#F0CF72" font-size="15" font-weight="700" letter-spacing="1">ANSIBLE</text>
      <text x="20" y="57" fill="#FFFFFF" font-size="23" font-weight="700">4 roles</text>
    </g>
    <g transform="translate(462 336)">
      <rect width="180" height="72" rx="8" fill="#FFFFFF" opacity="0.09" stroke="#F0CF72" stroke-opacity="0.42"/>
      <text x="20" y="31" fill="#F0CF72" font-size="15" font-weight="700" letter-spacing="1">OBSERVABILITY</text>
      <text x="20" y="57" fill="#FFFFFF" font-size="23" font-weight="700">9 services</text>
    </g>
    <g transform="translate(658 336)">
      <rect width="180" height="72" rx="8" fill="#FFFFFF" opacity="0.09" stroke="#F0CF72" stroke-opacity="0.42"/>
      <text x="20" y="31" fill="#F0CF72" font-size="15" font-weight="700" letter-spacing="1">RECOVERY</text>
      <text x="20" y="57" fill="#FFFFFF" font-size="23" font-weight="700">RTO 13 sec</text>
    </g>

    <rect x="70" y="442" width="768" height="54" rx="27" fill="#0F1821" opacity="0.72"/>
    <circle cx="98" cy="469" r="7" fill="#8FD3A4"/>
    <text x="118" y="477" fill="#E8F0F4" font-size="19" font-weight="500">記録済みcommitの実測と NOT RUN を明確に分離</text>

    <text x="70" y="564" fill="#FFFFFF" font-size="27" font-weight="700">島田 則幸</text>
    <text x="212" y="564" fill="#AFC0CB" font-size="21">Noriyuki Shimada</text>
    <text x="70" y="600" fill="#F0CF72" font-size="20" font-weight="600" letter-spacing="1">ns7jp.github.io</text>
  </g>

  <g transform="translate(890 104)" filter="url(#shadow)">
    <rect width="238" height="390" rx="18" fill="#F7F4EC"/>
    <rect width="238" height="58" rx="18" fill="#263A4B"/>
    <rect y="40" width="238" height="18" fill="#263A4B"/>
    <circle cx="28" cy="28" r="6" fill="#F0CF72"/>
    <circle cx="48" cy="28" r="6" fill="#8FD3A4"/>
    <circle cx="68" cy="28" r="6" fill="#D27B6F"/>

    <g transform="translate(28 90)" font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif">
      <g>
        <rect width="182" height="44" rx="7" fill="#E9E1D2"/>
        <circle cx="23" cy="22" r="11" fill="#765400"/>
        <text x="48" y="28" fill="#263A4B" font-size="17" font-weight="700">01  DESIGN</text>
      </g>
      <path d="M23 44v18" stroke="#765400" stroke-width="3"/>
      <g transform="translate(0 62)">
        <rect width="182" height="44" rx="7" fill="#E9E1D2"/>
        <circle cx="23" cy="22" r="11" fill="#765400"/>
        <text x="48" y="28" fill="#263A4B" font-size="17" font-weight="700">02  BUILD</text>
      </g>
      <path d="M23 106v18" stroke="#765400" stroke-width="3"/>
      <g transform="translate(0 124)">
        <rect width="182" height="44" rx="7" fill="#E9E1D2"/>
        <circle cx="23" cy="22" r="11" fill="#765400"/>
        <text x="48" y="28" fill="#263A4B" font-size="17" font-weight="700">03  TEST</text>
      </g>
      <path d="M23 168v18" stroke="#765400" stroke-width="3"/>
      <g transform="translate(0 186)">
        <rect width="182" height="44" rx="7" fill="#E9E1D2"/>
        <circle cx="23" cy="22" r="11" fill="#765400"/>
        <text x="48" y="28" fill="#263A4B" font-size="17" font-weight="700">04  OBSERVE</text>
      </g>
      <path d="M23 230v18" stroke="#765400" stroke-width="3"/>
      <g transform="translate(0 248)">
        <rect width="182" height="44" rx="7" fill="#263A4B"/>
        <circle cx="23" cy="22" r="11" fill="#8FD3A4"/>
        <path d="M18 22l4 4 7-9" fill="none" stroke="#263A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="28" fill="#FFFFFF" font-size="17" font-weight="700">05  RECOVER</text>
      </g>
    </g>
  </g>
</svg>
