# Grafana 起動時に自動登録するデータソース
# 手動UI操作なしで Prometheus / Loki を Grafana に取り込むための provisioning ファイル
# メトリクス (Prometheus) とログ (Loki) の両方を扱うことで、
# 「グラフ上で異常を見つけ → そのまま該当時刻のログにジャンプ」という運用フローを実現する。

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
