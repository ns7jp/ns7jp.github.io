    <text x="540" y="62" fill="#666" font-size="10" font-weight="600">Status</text>
    <line x1="0" y1="70" x2="690" y2="70" stroke="#e0e0e0"/>

    <!-- 行 1: VNet -->
    <rect x="14" y="84" width="14" height="14" fill="#0078d4"/>
    <text x="34" y="95" fill="#0078d4" font-size="11" font-weight="600">shimada-lab-vnet</text>
    <text x="220" y="95" fill="#1a1a1a" font-size="11">Virtual network</text>
    <text x="430" y="95" fill="#1a1a1a" font-size="11">Japan East</text>
    <text x="540" y="95" fill="#107c10" font-size="11">✓ Active</text>
    <line x1="0" y1="106" x2="690" y2="106" stroke="#f0f0f0"/>

    <!-- 行 2: subnet app -->
    <rect x="14" y="116" width="14" height="14" fill="#5c2d91"/>
    <text x="34" y="127" fill="#0078d4" font-size="11">shimada-lab-vnet/snet-app</text>
    <text x="220" y="127" fill="#1a1a1a" font-size="11">Subnet · 10.50.10.0/24</text>
    <text x="430" y="127" fill="#1a1a1a" font-size="11">Japan East</text>
    <text x="540" y="127" fill="#107c10" font-size="11">✓ Active</text>
    <line x1="0" y1="138" x2="690" y2="138" stroke="#f0f0f0"/>

    <!-- 行 3: subnet bastion -->
    <rect x="14" y="148" width="14" height="14" fill="#5c2d91"/>
    <text x="34" y="159" fill="#0078d4" font-size="11">shimada-lab-vnet/AzureBastionSubnet</text>
    <text x="220" y="159" fill="#1a1a1a" font-size="11">Subnet · 10.50.255.0/27</text>
    <text x="430" y="159" fill="#1a1a1a" font-size="11">Japan East</text>
    <text x="540" y="159" fill="#107c10" font-size="11">✓ Active</text>
    <line x1="0" y1="170" x2="690" y2="170" stroke="#f0f0f0"/>

    <!-- 行 4: NSG -->
    <rect x="14" y="180" width="14" height="14" fill="#d83b01"/>
    <text x="34" y="191" fill="#0078d4" font-size="11" font-weight="600">shimada-lab-app-nsg</text>
    <text x="220" y="191" fill="#1a1a1a" font-size="11">Network security group</text>
    <text x="430" y="191" fill="#1a1a1a" font-size="11">Japan East</text>
    <text x="540" y="191" fill="#107c10" font-size="11">✓ Active (2 rules)</text>
    <line x1="0" y1="202" x2="690" y2="202" stroke="#f0f0f0"/>

    <!-- 行 5: NIC -->
    <rect x="14" y="212" width="14" height="14" fill="#0078d4"/>
    <text x="34" y="223" fill="#0078d4" font-size="11">shimada-lab-vm-nic</text>
    <text x="220" y="223" fill="#1a1a1a" font-size="11">Network interface · 10.50.10.4</text>
    <text x="430" y="223" fill="#1a1a1a" font-size="11">Japan East</text>
    <text x="540" y="223" fill="#107c10" font-size="11">✓ Active</text>
    <line x1="0" y1="234" x2="690" y2="234" stroke="#f0f0f0"/>

    <!-- 行 6: VM -->
    <rect x="14" y="244" width="14" height="14" fill="#7fba00"/>
    <text x="34" y="255" fill="#0078d4" font-size="11" font-weight="600">shimada-lab-vm</text>
    <text x="220" y="255" fill="#1a1a1a" font-size="11">Virtual machine · Standard_B1s</text>
    <text x="430" y="255" fill="#1a1a1a" font-size="11">Japan East</text>
    <text x="540" y="255" fill="#107c10" font-size="11">✓ Running</text>
    <line x1="0" y1="266" x2="690" y2="266" stroke="#f0f0f0"/>

    <!-- 行 7: OS disk -->
    <rect x="14" y="276" width="14" height="14" fill="#7fba00"/>
    <text x="34" y="287" fill="#0078d4" font-size="11">shimada-lab-vm-osdisk</text>
    <text x="220" y="287" fill="#1a1a1a" font-size="11">Disk · Standard_LRS · 30 GiB</text>
    <text x="430" y="287" fill="#1a1a1a" font-size="11">Japan East</text>
    <text x="540" y="287" fill="#107c10" font-size="11">✓ Attached</text>
    <line x1="0" y1="298" x2="690" y2="298" stroke="#f0f0f0"/>

    <!-- 行 8: Public IP -->
    <rect x="14" y="308" width="14" height="14" fill="#0078d4"/>
    <text x="34" y="319" fill="#0078d4" font-size="11">shimada-lab-bastion-pip</text>
    <text x="220" y="319" fill="#1a1a1a" font-size="11">Public IP · Standard · 20.27.x.x</text>
    <text x="430" y="319" fill="#1a1a1a" font-size="11">Japan East</text>
    <text x="540" y="319" fill="#107c10" font-size="11">✓ Allocated</text>
    <line x1="0" y1="330" x2="690" y2="330" stroke="#f0f0f0"/>

    <!-- 行 9: Bastion -->
    <rect x="14" y="340" width="14" height="14" fill="#e3008c"/>
    <text x="34" y="351" fill="#0078d4" font-size="11" font-weight="600">shimada-lab-bastion</text>
    <text x="220" y="351" fill="#1a1a1a" font-size="11">Bastion · Basic SKU</text>
    <text x="430" y="351" fill="#1a1a1a" font-size="11">Japan East</text>
    <text x="540" y="351" fill="#107c10" font-size="11">✓ Succeeded</text>

    <!-- フッタ -->
    <line x1="0" y1="390" x2="690" y2="390" stroke="#e0e0e0"/>
    <text x="14" y="410" fill="#666" font-size="10">Deployed by Terraform 1.9.5 · azurerm provider ~&gt; 4.0 · 9 resources / 0 changes / 0 destroys</text>
    <text x="14" y="424" fill="#666" font-size="10">Estimated cost: ~ ¥1,200 / month (Bastion Basic dominates — destroy after lab)</text>
  </g>

  <!-- 右ペイン: Terraform apply 出力 -->
  <g transform="translate(950,150)">
    <rect width="230" height="430" fill="#1e1e1e"/>
    <text x="14" y="22" fill="#dcdcdc" font-size="11" font-weight="600">$ terraform apply</text>
    <text x="14" y="44" fill="#7eb26d" font-size="9" font-family="monospace">+ resource_group.lab</text>
    <text x="14" y="58" fill="#7eb26d" font-size="9" font-family="monospace">+ virtual_network.lab</text>
    <text x="14" y="72" fill="#7eb26d" font-size="9" font-family="monospace">+ subnet.app</text>
    <text x="14" y="86" fill="#7eb26d" font-size="9" font-family="monospace">+ subnet.bastion</text>
    <text x="14" y="100" fill="#7eb26d" font-size="9" font-family="monospace">+ nsg.app</text>
    <text x="14" y="114" fill="#7eb26d" font-size="9" font-family="monospace">+ nsg.association</text>
    <text x="14" y="128" fill="#7eb26d" font-size="9" font-family="monospace">+ nic.vm</text>
    <text x="14" y="142" fill="#7eb26d" font-size="9" font-family="monospace">+ linux_vm.lab</text>
    <text x="14" y="156" fill="#7eb26d" font-size="9" font-family="monospace">+ public_ip.bastion</text>
    <text x="14" y="170" fill="#7eb26d" font-size="9" font-family="monospace">+ bastion_host.lab</text>
    <text x="14" y="194" fill="#dcdcdc" font-size="9" font-family="monospace">Plan: 10 to add</text>

    <line x1="14" y1="210" x2="216" y2="210" stroke="#444"/>

    <text x="14" y="232" fill="#5794f2" font-size="9" font-family="monospace">apply: 4m 38s elapsed</text>
    <text x="14" y="248" fill="#dcdcdc" font-size="9" font-family="monospace">Outputs:</text>
    <text x="14" y="266" fill="#dcdcdc" font-size="9" font-family="monospace">resource_group_name</text>
    <text x="22" y="280" fill="#a4a8b0" font-size="9" font-family="monospace">= "shimada-lab-rg"</text>
    <text x="14" y="298" fill="#dcdcdc" font-size="9" font-family="monospace">vm_private_ip</text>
    <text x="22" y="312" fill="#a4a8b0" font-size="9" font-family="monospace">= "10.50.10.4"</text>
    <text x="14" y="330" fill="#dcdcdc" font-size="9" font-family="monospace">bastion_fqdn</text>
    <text x="22" y="344" fill="#a4a8b0" font-size="9" font-family="monospace">= "bst-a1b2.bastion</text>
    <text x="22" y="358" fill="#a4a8b0" font-size="9" font-family="monospace">  .azure.com"</text>

    <line x1="14" y1="375" x2="216" y2="375" stroke="#444"/>
    <text x="14" y="395" fill="#eab839" font-size="9" font-family="monospace">$ az network bastion</text>
    <text x="14" y="409" fill="#eab839" font-size="9" font-family="monospace">  ssh -n shimada-lab-</text>
    <text x="14" y="423" fill="#eab839" font-size="9" font-family="monospace">  bastion ...</text>
  </g>

  <!-- 下部: NSG ルール詳細 -->
