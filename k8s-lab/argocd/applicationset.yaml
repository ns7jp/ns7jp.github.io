# ApplicationSet: dev / stg / prod の Application を 1 つの定義から自動生成。
# overlay のディレクトリ構造とそのまま 1:1 で対応する。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: portfolio-lab
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            syncPolicy: auto-with-selfheal
          - env: stg
            syncPolicy: auto-prune-only
          - env: prod
            syncPolicy: manual

  template:
    metadata:
      name: 'web-{{env}}'
      labels:
        environment: '{{env}}'
    spec:
      project: portfolio-lab
      source:
        repoURL: https://github.com/ns7jp/ns7jp.github.io
        targetRevision: main
        path: 'k8s-lab/overlays/{{env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'lab-{{env}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
        # 自動 sync は dev / stg のみ (syncPolicy フィールドの値で分岐)
        # 注: 本当に分岐させるなら ApplicationSet template patch か複数 ApplicationSet にする
        automated:
          prune: true
          selfHeal: false   # prod は manual なのでここは default 値。本番運用では別 Application に分ける。

      revisionHistoryLimit: 10
