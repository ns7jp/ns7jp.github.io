# Dependabot: 各 Lab のベースイメージ / プロバイダー / Action を週次で確認。
# - 採用担当者に「依存を放置していない」 ことが伝わる
# - セキュリティパッチを取り込む運用習慣の証跡になる
# - PR ベースで届くので即マージはせずレビューする運用

version: 2
updates:
  # GitHub Actions のバージョン (uses: の sha / tag)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci

  # Docker base image (docker-lab/Dockerfile の FROM)
  - package-ecosystem: docker
    directory: /docker-lab
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    labels:
      - dependencies
      - docker

  # Python (docker-lab/requirements.txt) - 将来依存が増えた時用
  - package-ecosystem: pip
    directory: /docker-lab
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - python

  # Terraform プロバイダー (terraform-lab)
  - package-ecosystem: terraform
    directory: /terraform-lab
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(terraform)"
    labels:
      - dependencies
      - terraform
