apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod 環境: 本番想定。
# - namespace: lab-prod
# - replicas は最低 3 で 1 ゾーン障害に耐える
# - image tag は semver pin (運用上は digest pin が望ましい)
# - resources は dev / stg より厚く
# - HPA maxReplicas を引き上げ
# - 外部 LB / WAF / cert-manager (Let's Encrypt) 経由

namespace: lab-prod

resources:
  - ../../base
  - ingress.yaml

namePrefix: prod-

labels:
  - pairs:
      environment: prod
      app.kubernetes.io/instance: web-prod
    includeSelectors: false

images:
  - name: nginxinc/nginx-unprivileged
    newTag: 1.27.1-alpine

replicas:
  - name: web
    count: 3

patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

  - target:
      kind: HorizontalPodAutoscaler
      name: web
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10

  - target:
      kind: PodDisruptionBudget
      name: web
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2

  - target:
      kind: Namespace
      name: lab
    patch: |-
      - op: replace
        path: /metadata/name
        value: lab-prod
