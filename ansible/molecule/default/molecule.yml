# Molecule scenario: default
# Docker ドライバで Ubuntu 22.04 コンテナを立て、ansible/playbook.yml を流して
# 「冪等性」 と 「セキュリティ設定が実際に効いているか」 を verify.yml で検証する。
#
# 実行: cd ansible && molecule test
# (test = create → converge → idempotence → verify → destroy のフルライフサイクル)

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  playbooks:
    converge: ./converge.yml
    verify: ./verify.yml
  inventory:
    host_vars:
      ubuntu2204:
        ansible_python_interpreter: /usr/bin/python3
  config_options:
    defaults:
      stdout_callback: yaml
      callback_whitelist: profile_tasks, timer

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
