# Prometheus 本体設定
# - 15 秒間隔でターゲットをスクレイプ
# - node_exporter はホストネットワークで動かしているため、host.docker.internal で参照
# - alert.rules.yml にしきい値ベースのアラート定義を集約

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: lab-monitor

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node
    static_configs:
      - targets:
          # docker-compose では host.docker.internal を extra_hosts なしで使えない場合があるため、
          # Linuxホストでは host-gateway か、172.17.0.1 のような docker0 IP を直接指定する。
          - host.docker.internal:9100
        labels:
          host: lab-host-01

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://probe-target/
        labels:
          service: lab-http-target
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
