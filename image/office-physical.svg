<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>想定オフィスの物理層構成</title>
  <desc>サーバールームのラック（コアスイッチ、AD/ファイル/監視/バックアップ、UPS）、2F 営業フロアと 3F 開発フロアの島、フロアスイッチ、無線AP、複合機、入退室管理、監視カメラ、UPS A/B 系の電源系統を 1 枚で表した物理層構成図。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="rackBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37474f" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#263238" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1565c0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0d47a1" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="floor3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7d32" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1b5e20" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="upsA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c62828" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8e0000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="upsB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1976d2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d47a1" stop-opacity="0.35"/>
    </linearGradient>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a55c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e57373"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64b5f6"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <text x="600" y="34" fill="#FDFBF7" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">
    想定中規模オフィス — 物理層構成
  </text>
  <text x="600" y="56" fill="#c9a55c" font-size="13" text-anchor="middle">
    サーバールーム（ラック / UPS）／フロア（スイッチ / AP / 複合機）／物理セキュリティ
  </text>

  <!-- ========== Server Room ========== -->
  <g transform="translate(40,90)">
    <rect width="380" height="600" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.20)" stroke-dasharray="6,4"/>
    <text x="14" y="22" fill="#FDFBF7" font-size="13" font-weight="700">🏢 Server Room (1F)</text>
    <text x="14" y="40" fill="#c9a55c" font-size="11">温度 22℃ / 湿度 50% / 入退室 IC カード</text>

    <!-- Rack -->
    <g transform="translate(40,60)">
      <rect width="200" height="490" rx="4" fill="url(#rackBg)" stroke="#c9a55c" stroke-width="1.5"/>
      <text x="100" y="20" fill="#c9a55c" font-size="11" text-anchor="middle" font-weight="700">19" Rack (42U)</text>

      <!-- U42 KVM -->
      <g transform="translate(10,30)">
        <rect width="180" height="22" fill="#455a64" stroke="#90a4ae"/>
        <text x="6" y="15" fill="#fff" font-size="10">U42 KVM-01</text>
      </g>
      <!-- U40-38 core switches -->
      <g transform="translate(10,55)">
        <rect width="180" height="22" fill="#1976d2" stroke="#90caf9"/>
        <text x="6" y="15" fill="#fff" font-size="10">U40 core-sw-01  L3 / 48p PoE</text>
      </g>
      <g transform="translate(10,80)">
        <rect width="180" height="22" fill="#1565c0" stroke="#90caf9"/>
        <text x="6" y="15" fill="#fff" font-size="10">U38 core-sw-02  L3 / Standby</text>
      </g>
      <!-- spacer -->
      <g transform="translate(10,105)">
        <rect width="180" height="22" fill="#37474f"/>
        <text x="6" y="15" fill="#90a4ae" font-size="10">U36 (空き)</text>
      </g>
      <!-- AD01 -->
      <g transform="translate(10,130)">
        <rect width="180" height="22" fill="#2e7d32" stroke="#a5d6a7"/>
        <text x="6" y="15" fill="#fff" font-size="10">U30 ad01  AD/DNS/DHCP</text>
      </g>
      <!-- AD02 -->
      <g transform="translate(10,155)">
        <rect width="180" height="22" fill="#1b5e20" stroke="#a5d6a7"/>
        <text x="6" y="15" fill="#fff" font-size="10">U28 ad02  AD 冗長</text>
      </g>
      <!-- FS01 -->
      <g transform="translate(10,180)">
        <rect width="180" height="22" fill="#6a1b9a" stroke="#ce93d8"/>
        <text x="6" y="15" fill="#fff" font-size="10">U24 fs01  File Server</text>
      </g>
      <!-- BK01 -->
      <g transform="translate(10,205)">
        <rect width="180" height="22" fill="#4a148c" stroke="#ce93d8"/>
        <text x="6" y="15" fill="#fff" font-size="10">U22 bk01  Backup NAS</text>
      </g>
      <!-- MON01 -->
      <g transform="translate(10,230)">
        <rect width="180" height="22" fill="#ef6c00" stroke="#ffcc80"/>
        <text x="6" y="15" fill="#fff" font-size="10">U18 mon01  Prom + Graf + Loki</text>
      </g>
      <!-- spacer -->
      <g transform="translate(10,255)">
        <rect width="180" height="60" fill="#37474f"/>
        <text x="6" y="35" fill="#90a4ae" font-size="10">U12-U16 (拡張用)</text>
      </g>
      <!-- UPS A -->
      <g transform="translate(10,320)">
        <rect width="180" height="32" fill="url(#upsA)" stroke="#ef9a9a"/>
        <text x="6" y="13" fill="#fff" font-size="10" font-weight="700">U10  UPS-A (5kVA)</text>
        <text x="6" y="27" fill="#ffcdd2" font-size="9">分電盤 1A / バッテリ 4年</text>
      </g>
      <!-- UPS B -->
      <g transform="translate(10,357)">
        <rect width="180" height="32" fill="url(#upsB)" stroke="#90caf9"/>
        <text x="6" y="13" fill="#fff" font-size="10" font-weight="700">U06  UPS-B (5kVA)</text>
        <text x="6" y="27" fill="#bbdefb" font-size="9">分電盤 2A / バッテリ 4年</text>
      </g>
      <!-- PDU -->
      <g transform="translate(10,394)">
        <rect width="86" height="20" fill="#c62828"/>
        <text x="6" y="14" fill="#fff" font-size="9">U01 PDU-A 30A</text>
      </g>
      <g transform="translate(102,394)">
        <rect width="88" height="20" fill="#1565c0"/>
        <text x="6" y="14" fill="#fff" font-size="9">U01 PDU-B 30A</text>
      </g>

      <!-- power lines: small dots -->
      <text x="100" y="435" fill="#c9a55c" font-size="9" text-anchor="middle">A 系: 赤 ／ B 系: 青</text>
      <text x="100" y="455" fill="#c9a55c" font-size="9" text-anchor="middle">冗長機器は意図的に分離</text>
    </g>

    <!-- Power legend -->
    <g transform="translate(260,80)">
      <text x="0" y="0" fill="#FDFBF7" font-size="11" font-weight="700">電源系統</text>
      <line x1="0" y1="14" x2="40" y2="14" stroke="#e57373" stroke-width="3"/>
      <text x="48" y="18" fill="#FDFBF7" font-size="10">A 系 (UPS-A)</text>
      <line x1="0" y1="34" x2="40" y2="34" stroke="#64b5f6" stroke-width="3"/>
      <text x="48" y="38" fill="#FDFBF7" font-size="10">B 系 (UPS-B)</text>

      <text x="0" y="80" fill="#FDFBF7" font-size="11" font-weight="700">通信ケーブル</text>
      <line x1="0" y1="94" x2="40" y2="94" stroke="#c9a55c" stroke-width="2" marker-end="url(#arrowGold)"/>
      <text x="48" y="98" fill="#FDFBF7" font-size="10">Cat6a / 業務</text>
      <line x1="0" y1="114" x2="40" y2="114" stroke="#a5d6a7" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="48" y="118" fill="#FDFBF7" font-size="10">Cat6a / PoE+ AP</text>
    </g>
  </g>

  <!-- ========== Floor 2 (営業) ========== -->
  <g transform="translate(450,90)">
    <rect width="320" height="310" rx="6" fill="url(#floor2)" stroke="#90caf9" stroke-width="1.2"/>
    <text x="14" y="22" fill="#FDFBF7" font-size="13" font-weight="700">🏢 2F 営業フロア</text>
    <text x="14" y="40" fill="#c9a55c" font-size="11">User VLAN 30 / Guest+IoT VLAN 40</text>

    <!-- Floor switch -->
    <g transform="translate(20,60)">
      <rect width="160" height="36" rx="4" fill="#1976d2" stroke="#90caf9"/>
      <text x="80" y="15" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">SW-FL2-A</text>
      <text x="80" y="29" fill="#bbdefb" font-size="9" text-anchor="middle">core-sw-01 ge0/0/12〜30</text>
    </g>

    <!-- AP -->
    <g transform="translate(220,60)">
      <circle cx="20" cy="20" r="18" fill="#43a047" stroke="#a5d6a7"/>
      <text x="20" y="16" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">AP</text>
      <text x="20" y="28" fill="#fff" font-size="8" text-anchor="middle">FL2-01</text>
    </g>
    <text x="240" y="60" fill="#a5d6a7" font-size="9" text-anchor="middle">PoE+</text>

    <!-- 島 -->
    <g transform="translate(20,120)">
      <rect width="120" height="30" rx="2" fill="rgba(255,255,255,0.10)" stroke="#90caf9"/>
      <text x="60" y="19" fill="#FDFBF7" font-size="10" text-anchor="middle">島 営業1 (PC×6)</text>
    </g>
    <g transform="translate(170,120)">
      <rect width="120" height="30" rx="2" fill="rgba(255,255,255,0.10)" stroke="#90caf9"/>
      <text x="60" y="19" fill="#FDFBF7" font-size="10" text-anchor="middle">島 営業2 (PC×6)</text>
    </g>
    <g transform="translate(20,160)">
      <rect width="120" height="30" rx="2" fill="rgba(255,255,255,0.10)" stroke="#90caf9"/>
      <text x="60" y="19" fill="#FDFBF7" font-size="10" text-anchor="middle">島 営業3 (PC×6)</text>
    </g>
    <g transform="translate(170,160)">
      <rect width="120" height="30" rx="2" fill="rgba(255,255,255,0.10)" stroke="#90caf9"/>
      <text x="60" y="19" fill="#FDFBF7" font-size="10" text-anchor="middle">会議室 (PC×2)</text>
    </g>

    <!-- MFP -->
    <g transform="translate(20,210)">
      <rect width="80" height="40" rx="3" fill="#5d4037" stroke="#bcaaa4"/>
      <text x="40" y="18" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">🖨 MFP-01</text>
      <text x="40" y="32" fill="#d7ccc8" font-size="9" text-anchor="middle">複合機</text>
    </g>

    <!-- Camera -->
    <g transform="translate(120,210)">
      <rect width="80" height="40" rx="3" fill="#3e2723" stroke="#bcaaa4"/>
      <text x="40" y="18" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">📹 CAM-201</text>
      <text x="40" y="32" fill="#d7ccc8" font-size="9" text-anchor="middle">監視カメラ</text>
    </g>

    <!-- Door lock -->
    <g transform="translate(220,210)">
      <rect width="80" height="40" rx="3" fill="#37474f" stroke="#90a4ae"/>
      <text x="40" y="18" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">🔒 DOOR-2</text>
      <text x="40" y="32" fill="#cfd8dc" font-size="9" text-anchor="middle">IC 入退室</text>
    </g>

    <!-- Connections: lines from SW to islands -->
    <line x1="100" y1="96" x2="80"  y2="120" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="230" y2="120" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="80"  y2="160" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="230" y2="160" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="60"  y2="210" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="160" y2="210" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="260" y2="210" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="180" y1="78" x2="220" y2="78" stroke="#a5d6a7" stroke-width="2" stroke-dasharray="3,3"/>
  </g>

  <!-- ========== Floor 3 (開発) ========== -->
  <g transform="translate(790,90)">
    <rect width="370" height="310" rx="6" fill="url(#floor3)" stroke="#a5d6a7" stroke-width="1.2"/>
    <text x="14" y="22" fill="#FDFBF7" font-size="13" font-weight="700">🏢 3F 開発フロア</text>
    <text x="14" y="40" fill="#c9a55c" font-size="11">User VLAN 30 / Guest+IoT VLAN 40</text>

    <!-- Floor switch -->
    <g transform="translate(20,60)">
      <rect width="160" height="36" rx="4" fill="#2e7d32" stroke="#a5d6a7"/>
      <text x="80" y="15" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">SW-FL3-A</text>
      <text x="80" y="29" fill="#c8e6c9" font-size="9" text-anchor="middle">core-sw-02 ge0/0/12〜30</text>
    </g>

    <!-- AP -->
    <g transform="translate(220,60)">
      <circle cx="20" cy="20" r="18" fill="#43a047" stroke="#a5d6a7"/>
      <text x="20" y="16" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">AP</text>
      <text x="20" y="28" fill="#fff" font-size="8" text-anchor="middle">FL3-01</text>
    </g>
    <g transform="translate(290,60)">
      <circle cx="20" cy="20" r="18" fill="#43a047" stroke="#a5d6a7"/>
      <text x="20" y="16" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">AP</text>
      <text x="20" y="28" fill="#fff" font-size="8" text-anchor="middle">FL3-02</text>
    </g>

    <!-- 島 -->
    <g transform="translate(20,120)">
      <rect width="120" height="30" rx="2" fill="rgba(255,255,255,0.10)" stroke="#a5d6a7"/>
      <text x="60" y="19" fill="#FDFBF7" font-size="10" text-anchor="middle">島 開発1 (PC×8)</text>
    </g>
    <g transform="translate(170,120)">
      <rect width="120" height="30" rx="2" fill="rgba(255,255,255,0.10)" stroke="#a5d6a7"/>
      <text x="60" y="19" fill="#FDFBF7" font-size="10" text-anchor="middle">島 開発2 (PC×8)</text>
    </g>
    <g transform="translate(20,160)">
      <rect width="120" height="30" rx="2" fill="rgba(255,255,255,0.10)" stroke="#a5d6a7"/>
      <text x="60" y="19" fill="#FDFBF7" font-size="10" text-anchor="middle">島 検証 (PC×4)</text>
    </g>
    <g transform="translate(170,160)">
      <rect width="120" height="30" rx="2" fill="rgba(255,255,255,0.10)" stroke="#a5d6a7"/>
      <text x="60" y="19" fill="#FDFBF7" font-size="10" text-anchor="middle">会議室 (PC×3)</text>
    </g>

    <!-- MFP -->
    <g transform="translate(20,210)">
      <rect width="80" height="40" rx="3" fill="#5d4037" stroke="#bcaaa4"/>
      <text x="40" y="18" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">🖨 MFP-02</text>
      <text x="40" y="32" fill="#d7ccc8" font-size="9" text-anchor="middle">複合機</text>
    </g>
    <g transform="translate(120,210)">
      <rect width="80" height="40" rx="3" fill="#3e2723" stroke="#bcaaa4"/>
      <text x="40" y="18" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">📹 CAM-301</text>
      <text x="40" y="32" fill="#d7ccc8" font-size="9" text-anchor="middle">監視カメラ</text>
    </g>
    <g transform="translate(220,210)">
      <rect width="80" height="40" rx="3" fill="#37474f" stroke="#90a4ae"/>
      <text x="40" y="18" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">🔒 DOOR-3</text>
      <text x="40" y="32" fill="#cfd8dc" font-size="9" text-anchor="middle">IC 入退室</text>
    </g>

    <line x1="100" y1="96" x2="80"  y2="120" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="230" y2="120" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="80"  y2="160" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="230" y2="160" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="60"  y2="210" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="160" y2="210" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="100" y1="96" x2="260" y2="210" stroke="#c9a55c" stroke-width="1.2"/>
    <line x1="180" y1="78" x2="220" y2="78" stroke="#a5d6a7" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="180" y1="78" x2="290" y2="78" stroke="#a5d6a7" stroke-width="2" stroke-dasharray="3,3"/>
  </g>

  <!-- ========== Vertical connections (Server Room <-> Floors) ========== -->
  <!-- Server Room rack core-sw-01 to floor switches via riser -->
  <line x1="240" y1="180" x2="450" y2="170" stroke="#c9a55c" stroke-width="2" marker-end="url(#arrowGold)"/>
  <line x1="240" y1="205" x2="790" y2="170" stroke="#c9a55c" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- ========== Bottom section: principles ========== -->
  <g transform="translate(40,420)">
    <rect width="1120" height="310" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.20)"/>
    <text x="14" y="24" fill="#FDFBF7" font-size="13" font-weight="700">物理層 設計の柱</text>

    <g transform="translate(20,46)">
      <text x="0" y="0" fill="#c9a55c" font-size="12" font-weight="700">① 冗長化 (Redundancy)</text>
      <text x="0" y="20" fill="#FDFBF7" font-size="11">・コアスイッチを 2 台、AD DC を 2 台で並列</text>
      <text x="0" y="38" fill="#FDFBF7" font-size="11">・UPS A 系 / B 系、電源は意図的に分離</text>
      <text x="0" y="56" fill="#FDFBF7" font-size="11">・冗長ペアは台帳に明記</text>
    </g>

    <g transform="translate(300,46)">
      <text x="0" y="0" fill="#c9a55c" font-size="12" font-weight="700">② ラベリング (Labeling)</text>
      <text x="0" y="20" fill="#FDFBF7" font-size="11">・ケーブル両端に同じ ID</text>
      <text x="0" y="38" fill="#FDFBF7" font-size="11">・スイッチポート / VLAN / 用途を台帳</text>
      <text x="0" y="56" fill="#FDFBF7" font-size="11">・開通前にラベル必須</text>
    </g>

    <g transform="translate(580,46)">
      <text x="0" y="0" fill="#c9a55c" font-size="12" font-weight="700">③ 棚卸し (Inventory)</text>
      <text x="0" y="20" fill="#FDFBF7" font-size="11">・四半期: ラック / 配線 / AP / 複合機</text>
      <text x="0" y="38" fill="#FDFBF7" font-size="11">・半期: UPS バッテリ / 鍵 / 入退室カード</text>
      <text x="0" y="56" fill="#FDFBF7" font-size="11">・年次: シャットダウン連携テスト</text>
    </g>

    <g transform="translate(860,46)">
      <text x="0" y="0" fill="#c9a55c" font-size="12" font-weight="700">④ 物理セキュリティ</text>
      <text x="0" y="20" fill="#FDFBF7" font-size="11">・サーバールーム入退室記録</text>
      <text x="0" y="38" fill="#FDFBF7" font-size="11">・複合機ストレージ初期化（退役時）</text>
      <text x="0" y="56" fill="#FDFBF7" font-size="11">・カメラ録画保管期間の規程</text>
    </g>

    <text x="14" y="160" fill="#FDFBF7" font-size="13" font-weight="700">トラブル切り分け順（物理側）</text>
    <text x="20" y="184" fill="#FDFBF7" font-size="11">1. ステータス LED   2. ケーブル抜け / 緩み   3. ポート LED   4. ケーブルテスター</text>
    <text x="20" y="204" fill="#FDFBF7" font-size="11">5. 別ポート差し替え   6. 別ケーブル交換   7. PoE 給電確認   8. UPS / PDU 通電確認</text>
    <text x="20" y="230" fill="#c9a55c" font-size="11" font-style="italic">論理を疑う前に、物理を一巡する（原因の 6〜7 割は物理側にある）</text>

