# 最小構成の監視スタック
# Prometheus + node_exporter + Grafana + Loki + Promtail の 5 コンテナを 1 ホスト内で起動する Lab 用 compose ファイル。
# 想定: 自宅検証 VM / 1 台の Linux サーバー / 評価環境。
# 本番では node_exporter / Promtail を監視対象側へ分けて配置し、Prometheus と Grafana と Loki のデータを永続化する。
# メトリクス (Prometheus) と ログ (Loki) の両方を集約することで、
# 「Grafana で異常を検知 → そのまま該当時刻のログをドリルダウン」 という運用フローが実現する。

services:
  prometheus:
    # 監視データの収集とアラート評価を担当
    image: prom/prometheus:v2.54.1
    container_name: lab-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    # Linux Docker Engine では host.docker.internal が自動解決されないため、
    # extra_hosts で host-gateway を渡してホスト上の node_exporter (9100) へ到達できるようにする。
    # Docker Desktop (Mac / Windows) では元から解決できるので、この行があっても問題ない。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  node_exporter:
    # ホストのCPU / メモリ / ディスク / ネットワーク統計を Prometheus が読み取れる形式で公開
    image: prom/node-exporter:v1.8.2
    container_name: lab-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave

  grafana:
    # ダッシュボード表示
    image: grafana/grafana:11.2.0
    container_name: lab-grafana
    restart: unless-stopped
    environment:
      # 公開検証なので簡易パスワード。実運用では .env で必ず変更する。
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  loki:
    # ログ集約 (LogQL でクエリ)
    image: grafana/loki:3.2.0
    container_name: lab-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  promtail:
    # ホストの journald / /var/log / Docker コンテナログを Loki へ転送
    image: grafana/promtail:3.2.0
    container_name: lab-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      - loki
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
