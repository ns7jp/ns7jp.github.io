name: Security scan (Trivy / gitleaks)

on:
  push:
  pull_request:
  schedule:
    # 週次の定期スキャン（既知 CVE / 新規流出を検知する）
    - cron: "0 18 * * 0"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trivy-fs:
    name: Trivy (filesystem CVE + secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # trivy-action は v によって入力スキーマが揺れるため、binary を直接入れて
      # トラブルシュート可能な形にする。Lab 用なので結果は warning 扱い。
      - name: Install Trivy
        run: |
          curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version

      - name: Trivy filesystem scan (vuln + secret)
        continue-on-error: true
        run: |
          trivy fs \
            --scanners vuln,secret \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-dirs .git,node_modules,image \
            --format table \
            --exit-code 0 \
            . | tee trivy-fs.txt

      - name: Summary
        if: always()
        run: |
          echo "## Trivy filesystem scan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -200 trivy-fs.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  trivy-config:
    name: Trivy (Terraform / Compose / Ansible misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version

      - name: Trivy IaC misconfig scan
        continue-on-error: true
        run: |
          trivy config \
            --severity CRITICAL,HIGH,MEDIUM \
            --skip-dirs .git,node_modules,image \
            --format table \
            --exit-code 0 \
            . | tee trivy-config.txt

      - name: Summary
        if: always()
        run: |
          echo "## Trivy IaC misconfig scan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -300 trivy-config.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
