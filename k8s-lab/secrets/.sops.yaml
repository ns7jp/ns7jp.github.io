# SOPS: secrets/ 配下の YAML を age で暗号化する設定。
# 個別ファイルで指定するより一元管理できる。
#
# 1. age key を生成: age-keygen -o ~/.config/sops/age/keys.txt
# 2. 公開鍵を取得 (出力されたメッセージから抽出)
# 3. このファイルの age_recipients を埋める
# 4. secrets/foo.enc.yaml を編集: sops secrets/foo.enc.yaml
#
# 平文 commit を防ぐため、creation_rules で「.enc.yaml は必ず暗号化済み」 を強制する。

creation_rules:
  - path_regex: secrets/.*\.enc\.yaml$
    encrypted_regex: '^(data|stringData)$'
    age: >-
      age1exampleyourpublickeyhere000000000000000000000000000000000000
