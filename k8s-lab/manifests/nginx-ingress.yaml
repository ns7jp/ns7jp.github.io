# Ingress: hello.lab.local → nginx Service
# curl テスト:
#   curl -H "Host: hello.lab.local" http://localhost/

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  annotations:
    # nginx-ingress 公式デフォルトを使う
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: hello.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: http
