name: Infrastructure checks

on:
  push:
    paths:
      - 'ansible/**'
      - 'cloud-lab/**'
      - 'monitoring-stack/**'
      - 'support-scripts/linux-triage.sh'
      - 'infra-evidence/**'
      - '.github/workflows/infra-check.yml'
  pull_request:
    paths:
      - 'ansible/**'
      - 'cloud-lab/**'
      - 'monitoring-stack/**'
      - 'support-scripts/linux-triage.sh'
      - 'infra-evidence/**'
      - '.github/workflows/infra-check.yml'

permissions:
  contents: read

jobs:
  monitoring:
    name: Docker Compose and Prometheus config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate docker compose file
        run: docker compose -f monitoring-stack/docker-compose.yml config --quiet

      - name: Check Prometheus config
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring-stack/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Check Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring-stack/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check rules /etc/prometheus/alert.rules.yml

  ansible:
    name: Ansible syntax and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check playbook
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --syntax-check

      - name: Run ansible-lint
        run: ansible-lint --profile min ansible/playbook.yml

  cloud-terraform:
    name: Cloud Lab Terraform tests and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform -chdir=cloud-lab/terraform fmt -check

      - name: Terraform init without backend
        run: terraform -chdir=cloud-lab/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=cloud-lab/terraform validate

      - name: Terraform mocked plan tests
        run: terraform -chdir=cloud-lab/terraform test -verbose

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1

      - name: Run TFLint
        run: tflint --chdir=cloud-lab/terraform

      - name: Scan Terraform configuration for security findings
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: cloud-lab/terraform
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          hide-progress: true
        # This lab intentionally describes a public subnet and SSH bastion.
        # Findings remain visible in logs until accepted risks are documented.

  shell:
    name: Linux triage shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n support-scripts/linux-triage.sh

      - name: ShellCheck
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            koalaman/shellcheck-alpine:v0.10.0 \
            shellcheck /work/support-scripts/linux-triage.sh
