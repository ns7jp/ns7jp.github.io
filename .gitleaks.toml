# gitleaks 設定
# Lab 用に明示的にプレースホルダを許容する。
# 本番リポジトリでは extend.useDefault = true のまま、allowlist のみ整える。

title = "ns7jp gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Lab placeholders / test fixtures"

paths = [
  '''support-scripts/samples/.*''',
  '''ansible/samples/.*''',
  '''monitoring-stack/samples/.*''',
  '''.*\.sample\.(json|csv|html|txt|log)$'''
]

regexes = [
  # 公開鍵プレースホルダ
  '''ssh-ed25519 AAAA\.\.\. .*''',
  '''ssh-rsa AAAA\.\.\. .*''',
  # Slack webhook プレースホルダ
  '''https://hooks\.slack\.com/services/T000/B000/XXXX''',
  # changeme / dummy 系
  '''GF_SECURITY_ADMIN_PASSWORD=changeme''',
  '''smtp_auth_password: changeme''',
  '''<server-private-key>''',
  '''<client-private-key>''',
  '''<client-pub>''',
  '''<server-pub>''',
  '''<psk>'''
]
