<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Grafana ダッシュボード Node Overview (Lab) のレイアウト概念図</title>
  <desc>Prometheus + Loki + Alertmanager のデータソースを統合した Grafana ダッシュボード。メトリクス（CPU・メモリ・ディスク・Load・ネットワーク）、ログ（Syslog/auth.log）、現在のアラート（Alertmanager）、ログ流入レートを 1 画面で表示するレイアウト。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b1f"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2227"/>
      <stop offset="1" stop-color="#181b1f"/>
    </linearGradient>
    <linearGradient id="sparkBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5794f2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5794f2" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sparkPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b877d9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b877d9" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="1050" fill="url(#bg)"/>

  <!-- トップバー -->
  <rect x="0" y="0" width="1200" height="48" fill="#0b0c0e"/>
  <circle cx="28" cy="24" r="11" fill="#f15a29"/>
  <text x="50" y="29" fill="#dfe1e6" font-size="14" font-weight="600">Grafana — Lab / Node Overview (Lab)</text>
  <text x="430" y="29" fill="#5794f2" font-size="11">●Prometheus</text>
  <text x="510" y="29" fill="#b877d9" font-size="11">●Loki</text>
  <text x="555" y="29" fill="#e24d42" font-size="11">●Alertmanager</text>
  <text x="1080" y="29" fill="#8e9297" font-size="12">⏱ Last 1 hour</text>

  <!-- パネル 1: CPU 使用率 -->
  <g transform="translate(20,68)">
    <rect width="380" height="160" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">CPU 使用率</text>
    <text x="364" y="26" fill="#5d6066" font-size="11" text-anchor="end">%</text>
    <text x="190" y="108" fill="#7eb26d" font-size="58" font-weight="700" text-anchor="middle">23.4</text>
    <text x="190" y="135" fill="#8e9297" font-size="12" text-anchor="middle">lab-host-01</text>
    <rect x="18" y="146" width="240" height="5" fill="#7eb26d"/>
    <rect x="258" y="146" width="61" height="5" fill="#eab839"/>
    <rect x="319" y="146" width="43" height="5" fill="#e24d42"/>
  </g>

  <!-- パネル 2: メモリ使用率 -->
  <g transform="translate(410,68)">
    <rect width="380" height="160" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">メモリ使用率</text>
    <text x="364" y="26" fill="#5d6066" font-size="11" text-anchor="end">%</text>
    <text x="190" y="108" fill="#eab839" font-size="58" font-weight="700" text-anchor="middle">78.1</text>
    <text x="190" y="135" fill="#8e9297" font-size="12" text-anchor="middle">lab-host-01</text>
    <rect x="18" y="146" width="180" height="5" fill="#7eb26d"/>
    <rect x="198" y="146" width="60" height="5" fill="#eab839"/>
    <rect x="258" y="146" width="104" height="5" fill="#e24d42"/>
  </g>

  <!-- パネル 3: ディスク空き率 -->
  <g transform="translate(800,68)">
    <rect width="380" height="160" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">ディスク空き率 (/)</text>
    <text x="364" y="26" fill="#5d6066" font-size="11" text-anchor="end">%</text>
    <text x="190" y="108" fill="#7eb26d" font-size="58" font-weight="700" text-anchor="middle">42.6</text>
    <text x="190" y="135" fill="#8e9297" font-size="12" text-anchor="middle">lab-host-01</text>
    <rect x="18" y="146" width="36" height="5" fill="#e24d42"/>
    <rect x="54" y="146" width="36" height="5" fill="#eab839"/>
    <rect x="90" y="146" width="272" height="5" fill="#7eb26d"/>
  </g>

  <!-- パネル 4: Load average -->
  <g transform="translate(20,248)">
    <rect width="580" height="220" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">Load average (1 / 5 / 15)</text>
    <text x="40" y="60" fill="#5d6066" font-size="10" text-anchor="end">3.0</text>
    <text x="40" y="105" fill="#5d6066" font-size="10" text-anchor="end">2.0</text>
    <text x="40" y="150" fill="#5d6066" font-size="10" text-anchor="end">1.0</text>
    <text x="40" y="195" fill="#5d6066" font-size="10" text-anchor="end">0.0</text>
    <line x1="45" y1="55" x2="560" y2="55" stroke="#2c3035"/>
    <line x1="45" y1="100" x2="560" y2="100" stroke="#2c3035"/>
    <line x1="45" y1="145" x2="560" y2="145" stroke="#2c3035"/>
    <line x1="45" y1="190" x2="560" y2="190" stroke="#2c3035"/>
    <polyline fill="none" stroke="#7eb26d" stroke-width="2"
              points="50,180 80,160 110,170 140,140 170,150 200,130 230,155 260,120 290,140 320,100 350,125 380,80 410,110 440,90 470,120 500,105 530,115 560,130"/>
    <polyline fill="none" stroke="#eab839" stroke-width="2"
              points="50,185 80,175 110,170 140,165 170,158 200,152 230,148 260,142 290,140 320,135 350,132 380,125 410,122 440,118 470,120 500,122 530,125 560,128"/>
    <polyline fill="none" stroke="#ef843c" stroke-width="2"
              points="50,195 80,190 110,185 140,180 170,175 200,170 230,165 260,160 290,155 320,150 350,148 380,142 410,140 440,138 470,135 500,132 530,130 560,128"/>
    <text x="50" y="215" fill="#5d6066" font-size="10">-60m</text>
    <text x="200" y="215" fill="#5d6066" font-size="10">-40m</text>
    <text x="350" y="215" fill="#5d6066" font-size="10">-20m</text>
    <text x="540" y="215" fill="#5d6066" font-size="10">now</text>
    <rect x="430" y="40" width="9" height="9" fill="#7eb26d"/><text x="443" y="49" fill="#c4c6c9" font-size="10">load1</text>
    <rect x="475" y="40" width="9" height="9" fill="#eab839"/><text x="488" y="49" fill="#c4c6c9" font-size="10">load5</text>
    <rect x="520" y="40" width="9" height="9" fill="#ef843c"/><text x="533" y="49" fill="#c4c6c9" font-size="10">load15</text>
  </g>

  <!-- パネル 5: ネットワーク受信 -->
  <g transform="translate(610,248)">
    <rect width="570" height="220" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">ネットワーク受信 (bytes/s)</text>
    <text x="18" y="50" fill="#5d6066" font-size="11">eth0</text>
    <path d="M 50,180 L 80,150 L 110,165 L 140,130 L 170,145 L 200,100 L 230,120 L 260,80 L 290,105 L 320,60 L 350,85 L 380,45 L 410,70 L 440,55 L 470,80 L 500,65 L 530,75 L 560,85 L 560,195 L 50,195 Z"
          fill="url(#sparkBlue)" stroke="#5794f2" stroke-width="2"/>
    <text x="42" y="60" fill="#5d6066" font-size="10" text-anchor="end">2 MB</text>
    <text x="42" y="105" fill="#5d6066" font-size="10" text-anchor="end">1 MB</text>
    <text x="42" y="150" fill="#5d6066" font-size="10" text-anchor="end">500K</text>
    <text x="42" y="195" fill="#5d6066" font-size="10" text-anchor="end">0</text>
    <line x1="46" y1="55" x2="560" y2="55" stroke="#2c3035"/>
    <line x1="46" y1="100" x2="560" y2="100" stroke="#2c3035"/>
    <line x1="46" y1="150" x2="560" y2="150" stroke="#2c3035"/>
    <line x1="46" y1="195" x2="560" y2="195" stroke="#2c3035"/>
    <text x="50" y="215" fill="#5d6066" font-size="10">-60m</text>
    <text x="540" y="215" fill="#5d6066" font-size="10">now</text>
  </g>

  <!-- パネル 6: Loki ログ -->
  <g transform="translate(20,488)">
    <rect width="780" height="280" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">Syslog / auth.log (Loki)</text>
    <text x="18" y="44" fill="#b877d9" font-size="10">{job=~"syslog|auth"} |~ "(?i)(error|warn|fail|denied|critical)"</text>

    <!-- ログヘッダ -->
    <line x1="18" y1="58" x2="762" y2="58" stroke="#2c3035"/>
    <text x="22" y="74" fill="#5d6066" font-size="10">Time</text>
    <text x="120" y="74" fill="#5d6066" font-size="10">Level</text>
    <text x="180" y="74" fill="#5d6066" font-size="10">Message</text>
    <line x1="18" y1="80" x2="762" y2="80" stroke="#2c3035"/>

    <!-- ログ行 -->
    <text x="22" y="98" fill="#a4a8b0" font-size="10" font-family="monospace">09:42:14</text>
    <text x="120" y="98" fill="#e24d42" font-size="10" font-weight="600">ERR</text>
    <text x="180" y="98" fill="#dfe1e6" font-size="10" font-family="monospace">nginx[1856]: upstream timed out (110: Connection timed out) reading response from php-fpm</text>

    <text x="22" y="118" fill="#a4a8b0" font-size="10" font-family="monospace">09:39:55</text>
    <text x="120" y="118" fill="#eab839" font-size="10" font-weight="600">WARN</text>
    <text x="180" y="118" fill="#dfe1e6" font-size="10" font-family="monospace">php-fpm[2841]: [pool www] server reached pm.max_children (10), consider raising</text>

    <text x="22" y="138" fill="#a4a8b0" font-size="10" font-family="monospace">09:39:02</text>
    <text x="120" y="138" fill="#eab839" font-size="10" font-weight="600">WARN</text>
    <text x="180" y="138" fill="#dfe1e6" font-size="10" font-family="monospace">php-fpm[2841]: [pool www] server reached pm.max_children (10), consider raising</text>

    <text x="22" y="158" fill="#a4a8b0" font-size="10" font-family="monospace">09:38:14</text>
    <text x="120" y="158" fill="#eab839" font-size="10" font-weight="600">WARN</text>
    <text x="180" y="158" fill="#dfe1e6" font-size="10" font-family="monospace">php-fpm[2841]: [pool www] server reached pm.max_children (10), consider raising</text>

    <text x="22" y="178" fill="#a4a8b0" font-size="10" font-family="monospace">09:35:48</text>
    <text x="120" y="178" fill="#e24d42" font-size="10" font-weight="600">FAIL</text>
    <text x="180" y="178" fill="#dfe1e6" font-size="10" font-family="monospace">sshd[3104]: Failed password for invalid user admin from 203.0.113.42 port 51234</text>

    <text x="22" y="198" fill="#a4a8b0" font-size="10" font-family="monospace">09:33:21</text>
    <text x="120" y="198" fill="#e24d42" font-size="10" font-weight="600">FAIL</text>
    <text x="180" y="198" fill="#dfe1e6" font-size="10" font-family="monospace">sshd[3098]: Failed password for invalid user root from 203.0.113.42 port 51221</text>

    <text x="22" y="218" fill="#a4a8b0" font-size="10" font-family="monospace">09:30:12</text>
    <text x="120" y="218" fill="#eab839" font-size="10" font-weight="600">WARN</text>
    <text x="180" y="218" fill="#dfe1e6" font-size="10" font-family="monospace">kernel: Out of memory: Kill process 9821 (java) score 412</text>

    <text x="22" y="238" fill="#a4a8b0" font-size="10" font-family="monospace">09:28:55</text>
    <text x="120" y="238" fill="#eab839" font-size="10" font-weight="600">WARN</text>
    <text x="180" y="238" fill="#dfe1e6" font-size="10" font-family="monospace">systemd[1]: ondemand.service: Failed with result 'exit-code'.</text>

    <text x="22" y="258" fill="#a4a8b0" font-size="10" font-family="monospace">09:14:08</text>
    <text x="120" y="258" fill="#5794f2" font-size="10" font-weight="600">INFO</text>
    <text x="180" y="258" fill="#dfe1e6" font-size="10" font-family="monospace">CRON[2245]: (root) CMD (test -x /etc/cron.daily/logrotate && /etc/cron.daily/logrotate)</text>
  </g>

  <!-- パネル 7: Alertmanager 現在のアラート -->
  <g transform="translate(810,488)">
    <rect width="370" height="280" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">Alertmanager — 現在のアラート</text>
    <text x="350" y="26" fill="#5d6066" font-size="10" text-anchor="end">3 firing</text>

    <!-- アラート1 (critical) -->
    <g transform="translate(14,46)">
      <rect width="340" height="62" rx="3" fill="#3a2418" stroke="#e24d42"/>
      <circle cx="14" cy="14" r="5" fill="#e24d42"/>
      <text x="26" y="18" fill="#e24d42" font-size="10" font-weight="700">CRITICAL</text>
      <text x="80" y="18" fill="#8e9297" font-size="9">since 09:33</text>
      <text x="14" y="35" fill="#dfe1e6" font-size="11" font-weight="600">HostLowDisk — lab-host-01 /var</text>
      <text x="14" y="50" fill="#a4a8b0" font-size="9">空き 8.2% / 10% を下回って 14 分継続</text>
    </g>

    <!-- アラート2 (warning) -->
    <g transform="translate(14,116)">
      <rect width="340" height="62" rx="3" fill="#332a18" stroke="#eab839"/>
      <circle cx="14" cy="14" r="5" fill="#eab839"/>
      <text x="26" y="18" fill="#eab839" font-size="10" font-weight="700">WARNING</text>
      <text x="80" y="18" fill="#8e9297" font-size="9">since 09:35</text>
      <text x="14" y="35" fill="#dfe1e6" font-size="11" font-weight="600">HostHighCpu — lab-host-01</text>
      <text x="14" y="50" fill="#a4a8b0" font-size="9">CPU 98.4% / 85% を上回って 11 分継続</text>
    </g>

    <!-- アラート3 (warning) -->
    <g transform="translate(14,186)">
      <rect width="340" height="62" rx="3" fill="#332a18" stroke="#eab839"/>
      <circle cx="14" cy="14" r="5" fill="#eab839"/>
      <text x="26" y="18" fill="#eab839" font-size="10" font-weight="700">WARNING</text>
      <text x="80" y="18" fill="#8e9297" font-size="9">since 09:27</text>
      <text x="14" y="35" fill="#dfe1e6" font-size="11" font-weight="600">HostHighMemory — lab-host-01</text>
      <text x="14" y="50" fill="#a4a8b0" font-size="9">available 7.8% / 15分継続</text>
    </g>

    <text x="18" y="270" fill="#5d6066" font-size="9">→ Slack #ops-alerts / ops@example.com に通知済</text>
  </g>

  <!-- パネル 8: ログ流入量 -->
  <g transform="translate(20,788)">
    <rect width="1160" height="180" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">ログ流入量 / job 別 (Loki)</text>
    <text x="18" y="44" fill="#5d6066" font-size="10">sum by (job) (rate({host="lab-host-01"}[5m]))</text>

    <!-- グリッド -->
    <line x1="50" y1="60" x2="1140" y2="60" stroke="#2c3035"/>
    <line x1="50" y1="95" x2="1140" y2="95" stroke="#2c3035"/>
    <line x1="50" y1="130" x2="1140" y2="130" stroke="#2c3035"/>
    <line x1="50" y1="165" x2="1140" y2="165" stroke="#2c3035"/>
    <text x="44" y="64" fill="#5d6066" font-size="9" text-anchor="end">30</text>
    <text x="44" y="99" fill="#5d6066" font-size="9" text-anchor="end">20</text>
    <text x="44" y="134" fill="#5d6066" font-size="9" text-anchor="end">10</text>
    <text x="44" y="169" fill="#5d6066" font-size="9" text-anchor="end">0</text>

    <!-- 系列 syslog (青) -->
    <polyline fill="none" stroke="#5794f2" stroke-width="2"
              points="55,155 110,150 165,148 220,145 275,140 330,138 385,135 440,130 495,125 550,128 605,130 660,132 715,128 770,125 825,120 880,118 935,115 990,112 1045,108 1100,105 1140,100"/>

    <!-- 系列 auth (紫) -->
    <polyline fill="none" stroke="#b877d9" stroke-width="2"
              points="55,162 110,160 165,158 220,158 275,155 330,155 385,154 440,152 495,150 550,148 605,148 660,140 715,120 770,75 825,72 880,80 935,85 990,90 1045,95 1100,98 1140,100"/>

    <!-- 系列 nginx (緑) -->
    <polyline fill="none" stroke="#7eb26d" stroke-width="2"
              points="55,158 110,155 165,150 220,148 275,142 330,140 385,135 440,128 495,120 550,108 605,98 660,85 715,70 770,55 825,52 880,55 935,60 990,68 1045,72 1100,75 1140,80"/>

    <!-- 系列 apt (グレー) -->
    <polyline fill="none" stroke="#8e9297" stroke-width="2"
              points="55,165 110,165 165,165 220,165 275,165 330,165 385,165 440,165 495,164 550,164 605,164 660,164 715,164 770,164 825,164 880,164 935,164 990,164 1045,164 1100,164 1140,164"/>

    <!-- 凡例 -->
    <rect x="950" y="40" width="9" height="9" fill="#5794f2"/><text x="963" y="49" fill="#c4c6c9" font-size="10">syslog</text>
    <rect x="1005" y="40" width="9" height="9" fill="#b877d9"/><text x="1018" y="49" fill="#c4c6c9" font-size="10">auth</text>
    <rect x="1050" y="40" width="9" height="9" fill="#7eb26d"/><text x="1063" y="49" fill="#c4c6c9" font-size="10">nginx</text>
    <rect x="1099" y="40" width="9" height="9" fill="#8e9297"/><text x="1112" y="49" fill="#c4c6c9" font-size="10">apt</text>

    <text x="55" y="178" fill="#5d6066" font-size="10">-60m</text>
    <text x="1130" y="178" fill="#5d6066" font-size="10" text-anchor="end">now</text>
  </g>

  <!-- フッタ -->
  <text x="20" y="998" fill="#5d6066" font-size="10">Lab 用統合ダッシュボード概念図 — メトリクス(Prometheus) + ログ(Loki) + アラート(Alertmanager) を 1 画面で確認</text>
  <text x="20" y="1015" fill="#5d6066" font-size="10">node-overview.json (8 panels) で Provisioning される実物のレイアウトと一致</text>
  <text x="20" y="1032" fill="#5d6066" font-size="10">DataSource 配色: 青=Prometheus, 紫=Loki, 赤=Alertmanager （上部バーの ● で示す）</text>
</svg>
