# 最小構成の監視スタック
# Prometheus + node_exporter + Grafana の3コンテナを 1 ホスト内で起動するLab用 compose ファイル。
# 想定: 自宅検証VM / 1台のLinuxサーバー / 評価環境。
# 本番では node_exporter を監視対象側へ分けて配置し、Prometheus と Grafana のデータを永続化する。

services:
  prometheus:
    # 監視データの収集とアラート評価を担当
    image: prom/prometheus:v2.54.1
    container_name: lab-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    # Linux Docker Engine では host.docker.internal が自動解決されないため、
    # extra_hosts で host-gateway を渡してホスト上の node_exporter (9100) へ到達できるようにする。
    # Docker Desktop (Mac / Windows) では元から解決できるので、この行があっても問題ない。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  node_exporter:
    # ホストのCPU / メモリ / ディスク / ネットワーク統計を Prometheus が読み取れる形式で公開
    image: prom/node-exporter:v1.8.2
    container_name: lab-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave

  alertmanager:
    # Prometheus からのアラートを受け取り、ルーティング・抑制・通知を行う
    image: prom/alertmanager:v0.27.0
    container_name: lab-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring

  loki:
    # ログ集約（Prometheus と同じラベルベース）
    image: grafana/loki:3.1.1
    container_name: lab-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  promtail:
    # ホストの /var/log を Loki へ転送するエージェント
    image: grafana/promtail:3.1.1
    container_name: lab-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
    depends_on:
      - loki
    networks:
      - monitoring

  grafana:
    # ダッシュボード表示
    image: grafana/grafana:11.2.0
    container_name: lab-grafana
    restart: unless-stopped
    environment:
      # 公開検証なので簡易パスワード。実運用では .env で必ず変更する。
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
