name: Static site check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check local HTML links
        run: node scripts/check-static-links.js

      - name: Check HTML structure
        run: node scripts/check-html-structure.js

      - name: Check accessibility and SEO guardrails
        run: node scripts/check-site-quality.js

      - name: Test external link checker guardrails
        run: node scripts/test-external-link-check.js

      - name: Check evidence replay video metadata
        run: node scripts/check-video-metadata.cjs

  image-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce image folder size budget (max 1.5MB)
        run: |
          MAX_BYTES=$((1500 * 1024))
          SIZE=$(du -sb image/ | cut -f1)
          KB=$((SIZE / 1024))
          MAX_KB=$((MAX_BYTES / 1024))
          echo "image/ folder: ${KB}KB (limit: ${MAX_KB}KB)"
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "::error::image/ folder exceeds budget: ${KB}KB > ${MAX_KB}KB"
            exit 1
          fi

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check live external links
        env:
          EXTERNAL_LINK_TIMEOUT_MS: "20000"
          EXTERNAL_LINK_CONCURRENCY: "3"
        run: node scripts/check-external-links.js
