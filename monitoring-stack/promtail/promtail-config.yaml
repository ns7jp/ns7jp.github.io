# Promtail: ホストの journald / syslog / コンテナログを Loki へ送る。
# - 監視対象 VM の docker / journal を直接読みに行く構成。
# - Lab 用なのでホストネットワークで動かし、/var/log と /var/lib/docker/containers をマウントする想定。

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1) systemd-journald (sshd, systemd-resolved, ufw など)
  - job_name: journal
    journal:
      json: false
      max_age: 12h
      path: /var/log/journal
      labels:
        job: systemd-journal
        host: lab-host-01
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal_priority_keyword']
        target_label: 'severity'

  # 2) 一般的な /var/log のテキストログ
  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: lab-host-01
          __path__: /var/log/*.log

  # 3) Docker コンテナログ (monitoring-stack 自身を含む)
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: lab-host-01
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
      - output:
          source: output
