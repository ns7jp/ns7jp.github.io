<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Azure Bastion 経由で Linux VM へ SSH 接続したターミナル画面の概念図</title>
  <desc>Azure Portal の Bastion 接続フォームで username と SSH 秘密鍵を指定し、ブラウザ内ターミナルで shimada-lab-vm に SSH 接続し、systemctl / ip / journalctl による状態確認と Ansible playbook の適用確認を行う流れを示す。</desc>

  <!-- 背景 -->
  <rect width="1200" height="720" fill="#f5f5f5"/>

  <!-- Azure Portal トップバー -->
  <rect x="0" y="0" width="1200" height="48" fill="#0078d4"/>
  <text x="20" y="30" fill="#ffffff" font-size="14" font-weight="600">Microsoft Azure</text>
  <text x="160" y="30" fill="#cfe4f7" font-size="11">› Virtual machines › shimada-lab-vm › Connect</text>

  <!-- 左ペイン: Bastion 接続フォーム -->
  <g transform="translate(20,68)">
    <rect width="340" height="624" fill="#ffffff" stroke="#d0d0d0"/>
    <rect width="340" height="40" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="14" y="25" fill="#1a1a1a" font-size="13" font-weight="600">Connect via Bastion</text>

    <text x="14" y="62" fill="#666" font-size="11">Authentication type</text>
    <rect x="14" y="68" width="312" height="32" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
    <text x="22" y="89" fill="#1a1a1a" font-size="11">SSH Private Key from Local File ▾</text>

    <text x="14" y="120" fill="#666" font-size="11">Username</text>
    <rect x="14" y="126" width="312" height="32" fill="#ffffff" stroke="#d0d0d0"/>
    <text x="22" y="147" fill="#1a1a1a" font-size="11" font-family="monospace">opsadmin</text>

    <text x="14" y="178" fill="#666" font-size="11">SSH Private Key file</text>
    <rect x="14" y="184" width="312" height="32" fill="#ffffff" stroke="#d0d0d0"/>
    <text x="22" y="205" fill="#1a1a1a" font-size="11" font-family="monospace">📎 id_ed25519</text>

    <rect x="14" y="244" width="312" height="36" fill="#0078d4"/>
    <text x="170" y="267" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Connect</text>

    <line x1="14" y1="306" x2="326" y2="306" stroke="#e0e0e0"/>
    <text x="14" y="328" fill="#1a1a1a" font-size="11" font-weight="600">Connection details</text>
    <text x="14" y="350" fill="#666" font-size="10">Target VM:</text>
    <text x="14" y="364" fill="#1a1a1a" font-size="10" font-family="monospace">  shimada-lab-vm (10.50.10.4)</text>
    <text x="14" y="384" fill="#666" font-size="10">Bastion:</text>
    <text x="14" y="398" fill="#1a1a1a" font-size="10" font-family="monospace">  shimada-lab-bastion</text>
    <text x="14" y="418" fill="#666" font-size="10">Protocol:</text>
    <text x="14" y="432" fill="#1a1a1a" font-size="10" font-family="monospace">  SSH (TCP 22) tunneled over 443</text>

    <line x1="14" y1="456" x2="326" y2="456" stroke="#e0e0e0"/>
    <text x="14" y="478" fill="#1a1a1a" font-size="11" font-weight="600">Security posture</text>
    <text x="14" y="498" fill="#107c10" font-size="10">✓ VM has no public IP</text>
    <text x="14" y="514" fill="#107c10" font-size="10">✓ NSG blocks Internet → VM</text>
    <text x="14" y="530" fill="#107c10" font-size="10">✓ SSH key-only (no password)</text>
    <text x="14" y="546" fill="#107c10" font-size="10">✓ Session logged to Azure Monitor</text>

    <line x1="14" y1="570" x2="326" y2="570" stroke="#e0e0e0"/>
    <text x="14" y="590" fill="#666" font-size="10">Session start:</text>
    <text x="14" y="604" fill="#1a1a1a" font-size="10" font-family="monospace">  2026-05-22 21:18:02 JST</text>
    <text x="14" y="611" fill="#666" font-size="10"></text>
  </g>

  <!-- 右ペイン: ターミナル -->
  <g transform="translate(380,68)">
    <rect width="800" height="624" fill="#1e1e1e"/>
    <!-- ターミナルヘッダ -->
    <rect width="800" height="28" fill="#2d2d2d"/>
    <circle cx="14" cy="14" r="6" fill="#ed6a5e"/>
    <circle cx="32" cy="14" r="6" fill="#f5bf4f"/>
    <circle cx="50" cy="14" r="6" fill="#62c554"/>
    <text x="400" y="18" fill="#a0a0a0" font-size="11" text-anchor="middle">opsadmin@shimada-lab-vm — Azure Bastion SSH</text>

    <!-- ターミナル本文 -->
    <text x="14" y="50" fill="#7eb26d" font-size="11" font-family="monospace">opsadmin@shimada-lab-vm:~$ </text>
    <text x="234" y="50" fill="#dcdcdc" font-size="11" font-family="monospace">uname -a &amp;&amp; uptime</text>

    <text x="14" y="68" fill="#dcdcdc" font-size="11" font-family="monospace">Linux shimada-lab-vm 5.15.0-119-generic #129-Ubuntu SMP Wed May  7 11:42 UTC</text>
    <text x="14" y="84" fill="#dcdcdc" font-size="11" font-family="monospace">x86_64 x86_64 x86_64 GNU/Linux</text>
    <text x="14" y="100" fill="#dcdcdc" font-size="11" font-family="monospace">21:18:08 up 2 min,  1 user,  load average: 0.42, 0.18, 0.07</text>

    <text x="14" y="124" fill="#7eb26d" font-size="11" font-family="monospace">opsadmin@shimada-lab-vm:~$ </text>
    <text x="234" y="124" fill="#dcdcdc" font-size="11" font-family="monospace">ip -br addr show</text>
    <text x="14" y="142" fill="#dcdcdc" font-size="11" font-family="monospace">lo               UNKNOWN        127.0.0.1/8 ::1/128</text>
    <text x="14" y="158" fill="#dcdcdc" font-size="11" font-family="monospace">eth0             UP             10.50.10.4/24 fe80::222:48ff:fe04:e5e7/64</text>

    <text x="14" y="182" fill="#7eb26d" font-size="11" font-family="monospace">opsadmin@shimada-lab-vm:~$ </text>
    <text x="234" y="182" fill="#dcdcdc" font-size="11" font-family="monospace">systemctl --failed</text>
    <text x="14" y="200" fill="#7eb26d" font-size="11" font-family="monospace">0 loaded units listed.</text>

    <text x="14" y="224" fill="#7eb26d" font-size="11" font-family="monospace">opsadmin@shimada-lab-vm:~$ </text>
    <text x="234" y="224" fill="#dcdcdc" font-size="11" font-family="monospace">ss -tulnp | head</text>
    <text x="14" y="242" fill="#dcdcdc" font-size="11" font-family="monospace">Netid State  Local Address:Port  Peer Address:Port Process</text>
    <text x="14" y="258" fill="#dcdcdc" font-size="11" font-family="monospace">tcp   LISTEN 0.0.0.0:22          0.0.0.0:*         sshd</text>

    <text x="14" y="282" fill="#7eb26d" font-size="11" font-family="monospace">opsadmin@shimada-lab-vm:~$ </text>
    <text x="234" y="282" fill="#dcdcdc" font-size="11" font-family="monospace">grep -E "PasswordAuthentication|PermitRootLogin" /etc/ssh/sshd_config</text>
    <text x="14" y="300" fill="#dcdcdc" font-size="11" font-family="monospace">PermitRootLogin no</text>
    <text x="14" y="316" fill="#dcdcdc" font-size="11" font-family="monospace">PasswordAuthentication no</text>

    <text x="14" y="340" fill="#7eb26d" font-size="11" font-family="monospace">opsadmin@shimada-lab-vm:~$ </text>
    <text x="234" y="340" fill="#dcdcdc" font-size="11" font-family="monospace">ufw status verbose | head</text>
    <text x="14" y="358" fill="#dcdcdc" font-size="11" font-family="monospace">Status: active</text>
    <text x="14" y="374" fill="#dcdcdc" font-size="11" font-family="monospace">Logging: on (low)</text>
    <text x="14" y="390" fill="#dcdcdc" font-size="11" font-family="monospace">Default: deny (incoming), allow (outgoing)</text>
    <text x="14" y="406" fill="#dcdcdc" font-size="11" font-family="monospace">To                Action      From</text>
    <text x="14" y="422" fill="#dcdcdc" font-size="11" font-family="monospace">22/tcp            ALLOW IN    Anywhere</text>
    <text x="14" y="438" fill="#dcdcdc" font-size="11" font-family="monospace">80/tcp            ALLOW IN    Anywhere</text>
    <text x="14" y="454" fill="#dcdcdc" font-size="11" font-family="monospace">443/tcp           ALLOW IN    Anywhere</text>

    <text x="14" y="478" fill="#7eb26d" font-size="11" font-family="monospace">opsadmin@shimada-lab-vm:~$ </text>
    <text x="234" y="478" fill="#dcdcdc" font-size="11" font-family="monospace">sudo fail2ban-client status sshd</text>
    <text x="14" y="496" fill="#dcdcdc" font-size="11" font-family="monospace">Status for the jail: sshd</text>
    <text x="14" y="512" fill="#dcdcdc" font-size="11" font-family="monospace">|- Filter</text>
    <text x="14" y="528" fill="#dcdcdc" font-size="11" font-family="monospace">|  `- Currently failed: 0 / Total failed: 0</text>
    <text x="14" y="544" fill="#dcdcdc" font-size="11" font-family="monospace">`- Actions</text>
    <text x="14" y="560" fill="#dcdcdc" font-size="11" font-family="monospace">   `- Currently banned: 0 / Total banned: 0</text>

    <line x1="14" y1="578" x2="786" y2="578" stroke="#444"/>
    <text x="14" y="596" fill="#eab839" font-size="10" font-family="monospace">→ Ansible playbook (SSH/UFW/fail2ban/auditd/自動更新) は適用済</text>
    <text x="14" y="610" fill="#eab839" font-size="10" font-family="monospace">→ 同 playbook を再実行すると changed=0 を確認可能 (samples/idempotency-rerun.sample.log)</text>
  </g>
</svg>
