name: Infrastructure checks

on:
  push:
    paths:
      - 'ansible/**'
      - 'cloud-lab/**'
      - 'monitoring-stack/**'
      - 'support-scripts/linux-triage.sh'
      - 'support-docs/m365-policy-examples/**'
      - '.github/workflows/infra-check.yml'
  pull_request:
    paths:
      - 'ansible/**'
      - 'cloud-lab/**'
      - 'monitoring-stack/**'
      - 'support-scripts/linux-triage.sh'
      - 'support-docs/m365-policy-examples/**'
      - '.github/workflows/infra-check.yml'

jobs:
  monitoring:
    name: Docker Compose and Prometheus config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate docker compose file
        run: docker compose -f monitoring-stack/docker-compose.yml config --quiet

      - name: Check Prometheus config
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring-stack/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Check Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring-stack/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check rules /etc/prometheus/alert.rules.yml

      - name: Verify Loki config
        run: |
          docker run --rm \
            -v "$PWD/monitoring-stack/loki:/etc/loki:ro" \
            grafana/loki:3.2.0 \
            -config.file=/etc/loki/loki-config.yml \
            -verify-config

      - name: Verify Promtail config
        run: |
          docker run --rm \
            -v "$PWD/monitoring-stack/promtail:/etc/promtail:ro" \
            grafana/promtail:3.2.0 \
            -config.file=/etc/promtail/promtail-config.yml \
            -check-syntax

      - name: Validate Grafana dashboards JSON
        run: |
          for f in monitoring-stack/grafana/provisioning/dashboards/*.json; do
            echo "Checking $f"
            jq -e . "$f" > /dev/null
          done

  ansible:
    name: Ansible syntax and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check playbook
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --syntax-check

      - name: Run ansible-lint
        run: ansible-lint --profile min ansible/playbook.yml

  cloud-terraform:
    name: Cloud Lab Terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform -chdir=cloud-lab/terraform fmt -check

      - name: Terraform init without backend
        run: terraform -chdir=cloud-lab/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=cloud-lab/terraform validate

  shell:
    name: Linux triage shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n support-scripts/linux-triage.sh

  m365-policies:
    name: M365 / Intune policy JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON syntax for all policy files
        run: |
          set -e
          dir=support-docs/m365-policy-examples
          if [ ! -d "$dir" ]; then
            echo "Policy directory not found: $dir"
            exit 1
          fi
          json_files=$(find "$dir" -name "*.json")
          if [ -z "$json_files" ]; then
            echo "No JSON files found in $dir"
            exit 0
          fi
          for f in $json_files; do
            echo "Checking $f"
            jq -e . "$f" > /dev/null
          done

      - name: Verify required keys (displayName or name)
        run: |
          set -e
          dir=support-docs/m365-policy-examples
          for f in $(find "$dir" -name "*.json"); do
            has_name=$(jq -e '.displayName // .name | strings | length > 0' "$f" || echo "false")
            if [ "$has_name" != "true" ]; then
              echo "FAIL: $f missing displayName or name"
              exit 1
            fi
          done
          echo "All policy files have displayName or name."
