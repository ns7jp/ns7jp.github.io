# Prometheus アラートルール
# Lab 用に最小限の4ルールを定義。実運用ではしきい値・for 時間・ラベルを環境に合わせる。

groups:
  - name: host-baseline
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} CPU 使用率が 85% を継続"
          description: "5分平均で 85% を超過。プロセス上位とイベントログを確認してください。"

      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} メモリ available が 10% 未満"
          description: "OOM Killer 発火の兆候を確認し、対象プロセスを特定してください。"

      - alert: HostLowDisk
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 < 10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} の空き容量が 10% 未満"
          description: "logrotate / 古いバックアップ / コアダンプの蓄積を確認してください。"

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "node_exporter 到達不能 ({{ $labels.instance }})"
          description: "サーバー本体ダウンか、node_exporter 障害の可能性。SSHでホスト疎通を確認してください。"

  # Google SRE Workbook の multi-window multi-burn-rate を簡易再現。
  # availability 目標 99.5% に対し、1h で 14.4x ペースで消費したら fast-burn、
  # 6h で 6x ペースで消費したら slow-burn として鳴らす。
  # (実運用には HTTP 5xx 等の SLI が必要。Lab では up{} で代用。)
  - name: slo-burn-rate
    rules:
      - alert: SLOFastBurn
        expr: |
          (
            1 - avg_over_time(up{job="node"}[1h])
          ) > (1 - 0.995) * 14.4
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "{{ $labels.host }} エラーバジェット fast-burn (1h 窓)"
          description: "1h 窓で 14.4x の速度でエラーバジェットを消費中。2 日でバジェット使い切るペース。即対応。"

      - alert: SLOSlowBurn
        expr: |
          (
            1 - avg_over_time(up{job="node"}[6h])
          ) > (1 - 0.995) * 6
        for: 15m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "{{ $labels.host }} エラーバジェット slow-burn (6h 窓)"
          description: "6h 窓で 6x の速度でエラーバジェットを消費中。月内バジェット枯渇の前兆。"
