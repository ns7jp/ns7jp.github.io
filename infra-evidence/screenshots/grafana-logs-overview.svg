<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Grafana ダッシュボード Logs Overview (Lab) 実機表示イメージ</title>
  <desc>Loki + Promtail のログ集約を Grafana で表示するダッシュボード。ログ件数 Stat 3 枚、host 別と severity 別の時系列、Logs パネル 2 枚 (error 系 / SSH 認証) を含む。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b1f"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22252b"/>
      <stop offset="1" stop-color="#181b1f"/>
    </linearGradient>
    <linearGradient id="logsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13161a"/>
      <stop offset="1" stop-color="#0d1013"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1400" height="48" fill="#0b0c0e"/>
  <g transform="translate(20,15)">
    <circle cx="14" cy="9" r="11" fill="#f15a29"/>
    <text x="36" y="14" fill="#dfe1e6" font-size="14" font-weight="600">Grafana</text>
    <text x="100" y="14" fill="#5d6066" font-size="13">/</text>
    <text x="115" y="14" fill="#dfe1e6" font-size="13">Dashboards</text>
    <text x="195" y="14" fill="#5d6066" font-size="13">/</text>
    <text x="210" y="14" fill="#dfe1e6" font-size="13">Lab</text>
    <text x="245" y="14" fill="#5d6066" font-size="13">/</text>
    <text x="260" y="14" fill="#dfe1e6" font-size="13" font-weight="600">Logs Overview (Lab)</text>
  </g>
  <g transform="translate(1140,15)">
    <text x="0" y="14" fill="#8e9297" font-size="12">⟳ 30s</text>
    <text x="50" y="14" fill="#8e9297" font-size="12">⏱ Last 6 hours</text>
    <rect x="170" y="-2" width="76" height="22" rx="3" fill="#1f4d8a"/>
    <text x="208" y="13" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Save ▼</text>
  </g>

  <!-- Side nav -->
  <rect x="0" y="48" width="56" height="852" fill="#111316"/>
  <g transform="translate(28,76)">
    <text x="0" y="0" fill="#8e9297" font-size="16" text-anchor="middle">⌂</text>
    <text x="0" y="40" fill="#7eb26d" font-size="16" text-anchor="middle">▦</text>
    <text x="0" y="80" fill="#8e9297" font-size="16" text-anchor="middle">⊜</text>
    <text x="0" y="120" fill="#8e9297" font-size="16" text-anchor="middle">⚠</text>
    <text x="0" y="160" fill="#8e9297" font-size="16" text-anchor="middle">⚙</text>
    <text x="0" y="200" fill="#8e9297" font-size="16" text-anchor="middle">📋</text>
  </g>

  <!-- ===== Row 1: 3 Stat panels ===== -->
  <g transform="translate(76,64)">
    <rect width="430" height="140" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">直近 5 分のログ件数 (host)</text>
    <text x="215" y="90" fill="#7eb26d" font-size="50" font-weight="700" text-anchor="middle">412</text>
    <text x="215" y="115" fill="#8e9297" font-size="12" text-anchor="middle">lab-host-01</text>
  </g>
  <g transform="translate(516,64)">
    <rect width="430" height="140" rx="3" fill="url(#panel)" stroke="#eab839" stroke-width="1.2"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">直近 5 分の error 件数</text>
    <text x="215" y="90" fill="#eab839" font-size="50" font-weight="700" text-anchor="middle">8</text>
    <text x="215" y="115" fill="#8e9297" font-size="12" text-anchor="middle">error|fail|critical</text>
  </g>
  <g transform="translate(956,64)">
    <rect width="424" height="140" rx="3" fill="url(#panel)" stroke="#e24d42" stroke-width="1.2"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">直近 5 分の SSH 認証失敗</text>
    <text x="212" y="90" fill="#e24d42" font-size="50" font-weight="700" text-anchor="middle">12</text>
    <text x="212" y="115" fill="#8e9297" font-size="12" text-anchor="middle">Failed password / Invalid user</text>
  </g>

  <!-- ===== Row 2: 2 time series ===== -->
  <g transform="translate(76,214)">
    <rect width="646" height="240" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">host 別 ログ流量 (10m バケット)</text>
    <text x="630" y="26" fill="#5d6066" font-size="11" text-anchor="end">logs/s</text>
    <text x="36" y="56" fill="#5d6066" font-size="10" text-anchor="end">12</text>
    <text x="36" y="106" fill="#5d6066" font-size="10" text-anchor="end">8</text>
    <text x="36" y="156" fill="#5d6066" font-size="10" text-anchor="end">4</text>
    <text x="36" y="220" fill="#5d6066" font-size="10" text-anchor="end">0</text>
    <line x1="40" y1="50"  x2="630" y2="50"  stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="100" x2="630" y2="100" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="150" x2="630" y2="150" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="216" x2="630" y2="216" stroke="#2c3035"/>

    <polyline points="40,180 90,170 140,160 190,165 240,140 290,130 340,135 390,110 440,120 490,100 540,115 590,90 630,105"
              fill="none" stroke="#5794f2" stroke-width="2"/>

    <g transform="translate(50,232)">
      <rect width="10" height="3" y="-3" fill="#5794f2"/>
      <text x="16" y="0" fill="#dfe1e6" font-size="11">lab-host-01</text>
    </g>
  </g>

  <g transform="translate(734,214)">
    <rect width="646" height="240" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="26" fill="#c4c6c9" font-size="13" font-weight="600">severity 別 流量</text>
    <text x="630" y="26" fill="#5d6066" font-size="11" text-anchor="end">logs/s</text>
    <text x="36" y="56" fill="#5d6066" font-size="10" text-anchor="end">2.0</text>
    <text x="36" y="106" fill="#5d6066" font-size="10" text-anchor="end">1.0</text>
    <text x="36" y="156" fill="#5d6066" font-size="10" text-anchor="end">0.5</text>
    <text x="36" y="220" fill="#5d6066" font-size="10" text-anchor="end">0</text>
    <line x1="40" y1="50"  x2="630" y2="50"  stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="100" x2="630" y2="100" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="150" x2="630" y2="150" stroke="#2c3035" stroke-dasharray="2,3"/>
    <line x1="40" y1="216" x2="630" y2="216" stroke="#2c3035"/>

    <!-- info -->
    <polyline points="40,170 90,160 140,165 190,158 240,150 290,160 340,155 390,150 440,165 490,158 540,170 590,160 630,165"
              fill="none" stroke="#7eb26d" stroke-width="1.8"/>
    <!-- warning -->
    <polyline points="40,195 90,200 140,190 190,205 240,200 290,195 340,205 390,210 440,200 490,205 540,210 590,195 630,200"
              fill="none" stroke="#eab839" stroke-width="1.8"/>
    <!-- err -->
    <polyline points="40,213 90,210 140,213 190,210 240,212 290,205 340,210 390,206 440,200 490,208 540,205 590,200 630,205"
              fill="none" stroke="#e24d42" stroke-width="1.8"/>

    <g transform="translate(50,232)">
      <rect width="10" height="3" y="-3" fill="#7eb26d"/>
      <text x="16" y="0" fill="#dfe1e6" font-size="11">info</text>
      <rect width="10" height="3" y="-3" x="60" fill="#eab839"/>
      <text x="76" y="0" fill="#dfe1e6" font-size="11">warning</text>
      <rect width="10" height="3" y="-3" x="160" fill="#e24d42"/>
      <text x="176" y="0" fill="#dfe1e6" font-size="11">err / crit</text>
    </g>
  </g>

  <!-- ===== Row 3: Logs panel - error lines ===== -->
  <g transform="translate(76,464)">
    <rect width="1304" height="200" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="22" fill="#c4c6c9" font-size="13" font-weight="600">直近のエラーログ (`{severity=~"err|crit|alert|emerg"}`)</text>
    <text x="1286" y="22" fill="#5d6066" font-size="10" text-anchor="end">8 lines · last 5m</text>
    <rect x="14" y="32" width="1276" height="158" rx="2" fill="url(#logsBg)" stroke="#2c3035"/>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="11">
      <text x="22" y="50" fill="#5d6066">15:42:18</text>
      <text x="92" y="50" fill="#e24d42">err</text>
      <text x="130" y="50" fill="#bbbf25">ssh.service</text>
      <text x="220" y="50" fill="#dfe1e6">Failed password for invalid user admin from 203.0.113.42 port 51234 ssh2</text>

      <text x="22" y="70" fill="#5d6066">15:41:55</text>
      <text x="92" y="70" fill="#e24d42">err</text>
      <text x="130" y="70" fill="#bbbf25">kernel</text>
      <text x="220" y="70" fill="#dfe1e6">Out of memory: Killed process 8421 (worker) total-vm:1.2GB anon-rss:980MB</text>

      <text x="22" y="90" fill="#5d6066">15:40:32</text>
      <text x="92" y="90" fill="#eab839">crit</text>
      <text x="130" y="90" fill="#bbbf25">backup.service</text>
      <text x="220" y="90" fill="#dfe1e6">Backup completed with non-zero exit (rc=2). See /var/log/daily-backup.log</text>

      <text x="22" y="110" fill="#5d6066">15:38:14</text>
      <text x="92" y="110" fill="#e24d42">err</text>
      <text x="130" y="110" fill="#bbbf25">nginx</text>
      <text x="220" y="110" fill="#dfe1e6">upstream timed out (110: Connection timed out) while connecting upstream</text>

      <text x="22" y="130" fill="#5d6066">15:35:08</text>
      <text x="92" y="130" fill="#e24d42">err</text>
      <text x="130" y="130" fill="#bbbf25">ssh.service</text>
      <text x="220" y="130" fill="#dfe1e6">Failed password for root from 198.51.100.7 port 39812 ssh2</text>

      <text x="22" y="150" fill="#5d6066">15:34:21</text>
      <text x="92" y="150" fill="#eab839">crit</text>
      <text x="130" y="150" fill="#bbbf25">postgresql</text>
      <text x="220" y="150" fill="#dfe1e6">database "app" connection limit exceeded for non-superuser (current_connections=99)</text>

      <text x="22" y="170" fill="#5d6066">15:30:02</text>
      <text x="92" y="170" fill="#e24d42">err</text>
      <text x="130" y="170" fill="#bbbf25">systemd</text>
      <text x="220" y="170" fill="#dfe1e6">app-worker.service: Main process exited, code=exited, status=1/FAILURE</text>
    </g>
  </g>

  <!-- ===== Row 4: Logs panel - SSH auth ===== -->
  <g transform="translate(76,674)">
    <rect width="1304" height="200" rx="3" fill="url(#panel)" stroke="#2c3035"/>
    <text x="18" y="22" fill="#c4c6c9" font-size="13" font-weight="600">SSH 認証ログ（成功 / 失敗）  `{unit="ssh.service"} |~ "(?i)accepted|failed|invalid"`</text>
    <text x="1286" y="22" fill="#5d6066" font-size="10" text-anchor="end">14 lines · last 1h</text>
    <rect x="14" y="32" width="1276" height="158" rx="2" fill="url(#logsBg)" stroke="#2c3035"/>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="11">
      <text x="22" y="50" fill="#5d6066">15:42:18</text>
      <text x="92" y="50" fill="#e24d42">FAILED</text>
      <text x="160" y="50" fill="#dfe1e6">Failed password for invalid user admin from 203.0.113.42 port 51234 ssh2</text>

      <text x="22" y="70" fill="#5d6066">15:41:02</text>
      <text x="92" y="70" fill="#e24d42">FAILED</text>
      <text x="160" y="70" fill="#dfe1e6">Failed password for invalid user oracle from 203.0.113.42 port 33214 ssh2</text>

      <text x="22" y="90" fill="#5d6066">15:35:08</text>
      <text x="92" y="90" fill="#e24d42">FAILED</text>
      <text x="160" y="90" fill="#dfe1e6">Failed password for root from 198.51.100.7 port 39812 ssh2</text>

      <text x="22" y="110" fill="#5d6066">15:21:44</text>
      <text x="92" y="110" fill="#e24d42">FAILED</text>
      <text x="160" y="110" fill="#dfe1e6">Invalid user test from 198.51.100.7 port 41008 ssh2</text>

      <text x="22" y="130" fill="#5d6066">15:18:09</text>
      <text x="92" y="130" fill="#7eb26d">OK</text>
      <text x="160" y="130" fill="#dfe1e6">Accepted publickey for shimada from 10.0.30.42 port 56812 ssh2: ED25519 SHA256:...</text>

      <text x="22" y="150" fill="#5d6066">15:05:33</text>
      <text x="92" y="150" fill="#7eb26d">OK</text>
      <text x="160" y="150" fill="#dfe1e6">Accepted publickey for shimada from 10.0.30.42 port 51234 ssh2: ED25519 SHA256:...</text>

      <text x="22" y="170" fill="#5d6066">14:58:42</text>
      <text x="92" y="170" fill="#e24d42">FAILED</text>
      <text x="160" y="170" fill="#dfe1e6">Failed password for invalid user postgres from 192.0.2.88 port 42120 ssh2</text>
    </g>
  </g>

  <!-- Footer status -->
  <text x="76" y="888" fill="#5d6066" font-size="10">Data source: Loki (http://loki:3100)</text>
  <text x="320" y="888" fill="#5d6066" font-size="10">Promtail: lab-host-01 (3 jobs: varlog / journal / docker)</text>
  <text x="1380" y="888" fill="#5d6066" font-size="10" text-anchor="end">Grafana 11.2.0  ·  Lab</text>
</svg>
