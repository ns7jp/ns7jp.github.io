name: Security scan (Trivy / gitleaks)

on:
  push:
  pull_request:
  schedule:
    # 週次の定期スキャン（既知 CVE / 新規流出を検知する）
    - cron: "0 18 * * 0"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for shallow=false)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trivy-fs:
    name: Trivy (filesystem CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # CRITICAL の真正脆弱性のみ build を止める。HIGH は観測のみ。
          # （Lab 静的サイトのため依存物が少なく、誤検出を許容するより観測継続を優先）
          exit-code: "0"
          format: table
          scanners: vuln,secret
          skip-dirs: .git,node_modules
          trivyignores: .trivyignore

  trivy-config:
    name: Trivy (Terraform / Compose / Ansible misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy IaC misconfig scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          # Lab 仕様（NOPASSWD:ALL / passwordless ssh など）の検出が多いため warn 運用
          exit-code: "0"
          trivyignores: .trivyignore
