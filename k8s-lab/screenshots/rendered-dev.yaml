apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/instance: web-dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: portfolio-lab
    environment: dev
    owner: ns7jp
    purpose: portfolio-lab
  name: lab-dev
---
apiVersion: v1
data:
  index.html: |
    <!doctype html>
    <html lang="ja">
    <head><meta charset="utf-8"><title>K8s Lab</title></head>
    <body>
      <h1>Kubernetes Lab</h1>
      <p>nginx + ConfigMap で配信されている静的ページです。Pod 名は環境変数で参照できます。</p>
    </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: web-dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: portfolio-lab
    environment: dev
  name: dev-web-config
  namespace: lab-dev
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: web
    app.kubernetes.io/instance: web-dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: portfolio-lab
    environment: dev
  name: dev-web
  namespace: lab-dev
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: web
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
    app.kubernetes.io/instance: web-dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: portfolio-lab
    environment: dev
  name: dev-web
  namespace: lab-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/port: "9113"
        prometheus.io/scrape: "true"
      labels:
        app: web
    spec:
      containers:
      - image: nginxinc/nginx-unprivileged:1.27-alpine
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        name: nginx
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
        - mountPath: /var/cache/nginx
          name: nginx-cache
        - mountPath: /var/run
          name: nginx-run
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: web
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          name: dev-web-config
        name: web-content
      - emptyDir: {}
        name: nginx-cache
      - emptyDir: {}
        name: nginx-run
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/instance: web-dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: portfolio-lab
    environment: dev
  name: dev-web
  namespace: lab-dev
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/instance: web-dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: portfolio-lab
    environment: dev
  name: dev-web
  namespace: lab-dev
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  maxReplicas: 2
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app.kubernetes.io/instance: web-dev
    environment: dev
  name: dev-web
  namespace: lab-dev
spec:
  ingressClassName: nginx
  rules:
  - host: web.dev.local
    http:
      paths:
      - backend:
          service:
            name: dev-web
            port:
              number: 80
        path: /
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: web-dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: portfolio-lab
    environment: dev
  name: dev-web-allow-internal
  namespace: lab-dev
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lab
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app: web
  policyTypes:
  - Ingress
