<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Azure Portal で表示した Lab リソースグループの概念図</title>
  <desc>Terraform で apply した結果 shimada-lab-rg リソースグループに作成された 9 リソース（VNet、2サブネット、NSG、NIC、Linux VM、Public IP、Bastion ホスト）と、Terraform plan 出力サンプル、Bastion 経由 SSH 接続イメージを Azure Portal 風の UI で示す概念図。</desc>

  <defs>
    <linearGradient id="azBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f5"/>
      <stop offset="1" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="760" fill="url(#azBg)"/>

  <!-- Azure Portal トップバー -->
  <rect x="0" y="0" width="1200" height="48" fill="#0078d4"/>
  <text x="20" y="30" fill="#ffffff" font-size="14" font-weight="600">Microsoft Azure</text>
  <text x="160" y="30" fill="#cfe4f7" font-size="11">› Resource groups › shimada-lab-rg</text>
  <text x="1180" y="30" fill="#cfe4f7" font-size="11" text-anchor="end">net7jp@gmail.com</text>

  <!-- サイドバー -->
  <rect x="0" y="48" width="220" height="712" fill="#0c3a6e"/>
  <text x="20" y="78" fill="#ffffff" font-size="11" font-weight="600">★ Favorites</text>
  <text x="20" y="100" fill="#cfe4f7" font-size="11">Resource groups</text>
  <text x="20" y="120" fill="#cfe4f7" font-size="11">Virtual machines</text>
  <text x="20" y="140" fill="#cfe4f7" font-size="11">Virtual networks</text>
  <text x="20" y="160" fill="#cfe4f7" font-size="11">Network security groups</text>
  <text x="20" y="180" fill="#cfe4f7" font-size="11">Bastions</text>
  <text x="20" y="200" fill="#cfe4f7" font-size="11">All resources</text>
  <text x="20" y="220" fill="#cfe4f7" font-size="11">Cost Management</text>

  <!-- メインタイトル -->
  <text x="240" y="80" fill="#1a1a1a" font-size="20" font-weight="700">shimada-lab-rg</text>
  <text x="240" y="100" fill="#666" font-size="11">Resource group · Japan East · Subscription: Lab</text>

  <!-- タグチップ -->
  <g transform="translate(240,110)">
    <rect width="68" height="20" rx="10" fill="#e1f0fa" stroke="#0078d4"/>
    <text x="34" y="14" fill="#0078d4" font-size="10" text-anchor="middle">env: lab</text>
    <rect x="74" width="80" height="20" rx="10" fill="#e1f0fa" stroke="#0078d4"/>
    <text x="114" y="14" fill="#0078d4" font-size="10" text-anchor="middle">owner: ns7jp</text>
    <rect x="160" width="120" height="20" rx="10" fill="#e1f0fa" stroke="#0078d4"/>
    <text x="220" y="14" fill="#0078d4" font-size="10" text-anchor="middle">purpose: az104-study</text>
  </g>

  <!-- リソース一覧 -->
  <g transform="translate(240,150)">
    <rect width="690" height="430" fill="#ffffff" stroke="#d0d0d0"/>
    <rect width="690" height="40" fill="#fafafa" stroke="#d0d0d0"/>
    <text x="14" y="25" fill="#1a1a1a" font-size="13" font-weight="600">Resources (9)</text>
    <text x="676" y="25" fill="#0078d4" font-size="11" text-anchor="end">⟳ Refresh</text>

    <!-- ヘッダ -->
    <line x1="0" y1="40" x2="690" y2="40" stroke="#d0d0d0"/>
    <text x="14" y="62" fill="#666" font-size="10" font-weight="600">Name</text>
    <text x="220" y="62" fill="#666" font-size="10" font-weight="600">Type</text>
